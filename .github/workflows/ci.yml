name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  etcd-image-smoke:
    name: Official etcd image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render etcd StatefulSet
        run: |
          helm template akernel deploy/akernel \
            --show-only charts/core/templates/etcd/etcd.yaml \
            > /tmp/etcd-statefulset.yaml
          grep -F 'image: "busybox:1.37.0-musl"' /tmp/etcd-statefulset.yaml
          grep -F 'image: "gcr.io/etcd-development/etcd:v3.6.8"' /tmp/etcd-statefulset.yaml
          grep -F -- '- /usr/local/bin/etcd' /tmp/etcd-statefulset.yaml
          grep -F -- '- --listen-client-urls=http://$(MY_POD_IP):2379' /tmp/etcd-statefulset.yaml
          test "$(grep -cF -- '- /bin/sh' /tmp/etcd-statefulset.yaml)" = 1

      - name: Verify official image runtime contract
        run: |
          volume="akernel-etcd-smoke-${GITHUB_RUN_ID}"
          trap 'docker volume rm -f "${volume}" >/dev/null 2>&1 || true' EXIT
          docker volume create "${volume}" >/dev/null
          docker run --rm --user 0:0 \
            -v "${volume}:/etcd" busybox:1.37.0-musl sh -ec '
              mkdir -p /etcd
              chown -R 1001:1001 /etcd
              chmod 0700 /etcd
            '
          set +e
          timeout 5 docker run --rm --user 1001:1001 \
            -v "${volume}:/etcd" \
            gcr.io/etcd-development/etcd:v3.6.8 \
            /usr/local/bin/etcd \
            --name=etcd0 \
            --data-dir=/etcd \
            --listen-client-urls=http://127.0.0.1:2379 \
            --advertise-client-urls=http://127.0.0.1:2379 \
            --listen-peer-urls=http://127.0.0.1:2378 \
            --initial-advertise-peer-urls=http://127.0.0.1:2378 \
            --initial-cluster=etcd0=http://127.0.0.1:2378
          status=$?
          set -e
          test "${status}" = 124
          docker run --rm -v "${volume}:/etcd" busybox:1.37.0-musl \
            test -s /etcd/member/snap/db

  sdk-unit-tests:
    name: Python SDK unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install SDK dependencies
        run: |
          python -m pip install -e './sdk/python[all]'

      - name: Run unit tests
        run: |
          make sdk-test

  sdk-quality:
    name: Python SDK lint and type checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install SDK development dependencies
        run: |
          python -m pip install -e './sdk/python[dev]'

      - name: Run SDK quality checks
        run: |
          make sdk-check

  deployment-script-syntax:
    name: Deployment script syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"

      - name: Check deployment script syntax
        run: |
          make deploy-script-check

      - name: Reject stale image push profiles
        run: |
          profile=".akernel/ci-stale-image-profile"
          mkdir -p "${profile}"
          printf '%s\n' \
            'IMAGE_REPOSITORY=example.invalid/akernel/all-in-one' \
            'IMAGE_TAG=test' \
            > "${profile}/config.env"

          set +e
          output="$(./deploy/scripts/push-image.sh \
            --vendor aliyun \
            --env ci-stale-image-profile 2>&1)"
          status=$?
          set -e

          test "${status}" -ne 0
          case "${output}" in
            *"missing dependency image settings"*) ;;
            *) printf '%s\n' "${output}" >&2; exit 1 ;;
          esac

  standalone-e2e:
    name: Standalone E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize build submodules
        run: |
          git submodule update --init src/sandboxd src/distill-fs

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install SDK dependencies
        run: |
          python -m pip install -e './sdk/python[all]'

      - name: Prepare host kernel modules
        run: |
          sudo modprobe tun
          sudo modprobe loop
          sudo modprobe erofs
          sudo modprobe br_netfilter
          test -c /dev/net/tun
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1

      - name: Build all-in-one image
        run: |
          AKERNEL_ENABLE_KATA=false \
            make build \
              IMAGE_REPOSITORY=akernel-ci/all-in-one \
              IMAGE_TAG="${GITHUB_SHA}" \
              RUNTIME_PROFILE=rrt

      - name: Start standalone AKernel
        run: |
          IMAGE="akernel-ci/all-in-one:${GITHUB_SHA}" \
            AKERNEL_NAT_BACKEND=iptables \
            ./deploy/standalone/start.sh

      - name: Run SDK end-to-end examples
        run: |
          gateway_ip="$(docker inspect \
            --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \
            akernel-traefik)"
          test -n "${gateway_ip}"
          token="$(cat deploy/standalone/data/token)"
          export AKERNEL_TOKEN="${token}"
          export AKERNEL_SERVER_ADDRESS="${gateway_ip}"
          export PYTHONPATH="${GITHUB_WORKSPACE}/sdk/python"

          examples=(
            basic_usage.py
            command_stdin.py
            custom_image.py
            dockerfile_launch.py
            named_sandbox.py
            network_policy.py
            port_forwarding.py
            pty.py
            reverse_tunnel.py
            storage_sandbox.py
          )
          for example in "${examples[@]}"; do
            echo "=== Running ${example} ==="
            timeout 120s python "sdk/python/examples/${example}"
          done

      - name: Run runsc checkpoint reload E2E
        run: |
          gateway_ip="$(docker inspect \
            --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \
            akernel-traefik)"
          test -n "${gateway_ip}"
          token="$(cat deploy/standalone/data/token)"
          export AKERNEL_TOKEN="${token}"
          export AKERNEL_SERVER_ADDRESS="${gateway_ip}"
          export AKERNEL_RUN_INTEGRATION=1
          export PYTHONPATH="${GITHUB_WORKSPACE}/sdk/python"

          AKERNEL_TEST_RUNTIME=runsc timeout 600s python \
            sdk/python/tests/integration/test_sandbox.py \
            SandboxReloadIntegrationTest -v

      - name: Show standalone diagnostics
        if: failure()
        run: |
          docker ps -a
          for container in akernel-node akernel-traefik; do
            if docker container inspect "${container}" >/dev/null 2>&1; then
              echo "=== ${container}: docker logs ==="
              docker logs --tail 500 "${container}" 2>&1 || true
            fi
          done
          if docker container inspect akernel-node >/dev/null 2>&1; then
            echo "=== akernel-node: service journal ==="
            docker exec akernel-node journalctl --no-pager -n 500 \
              -u sandboxd.service -u yuanrong.service || true
          fi

      - name: Stop standalone AKernel
        if: always()
        run: |
          if [[ -x ./deploy/standalone/stop.sh ]]; then
            ./deploy/standalone/stop.sh
          else
            docker rm -f akernel-traefik akernel-node >/dev/null 2>&1 || true
          fi
