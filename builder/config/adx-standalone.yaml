schema_version: 1
profile: standalone
internal_security: network
namespace: akernel
service_overrides:
  coordinator:
    config:
      placement: spread
      metrics_listen: 127.0.0.1:19090
      autoscaling_listen: 127.0.0.1:19092
    env:
      ADX_LOG_FORMAT: json
  adxlet:
    env:
      ADX_LOG_FORMAT: json
    config:
      metrics_listen: 127.0.0.1:19091
      metrics_interval_seconds: 15
      runtime_logs:
        directory: /home/akernel/adx/run/node/logs/runtime
      runtime_control:
        listen: 0.0.0.0:19003
        advertised_address: http://10.88.0.1:19003
        key_file: /home/akernel/adx/runtime-control-key
      execd_env:
        ADX_EXECD_CONTROL_SOCKET_PATH: /run/akernel
      resource_source:
        disk_path: /home/akernel
  apiserver:
    config:
      metrics_listen: 127.0.0.1:19093
    env:
      ADX_LOG_FORMAT: json
  ingress:
    env:
      ADX_LOG_FORMAT: json
      ADX_DATA_PLANE_INGRESS_PLAIN_BIND: 0.0.0.0:8080
      ADX_DATA_PLANE_INGRESS_ALLOWED_CLIENT_CIDRS: 0.0.0.0/0
      ADX_DATA_PLANE_INGRESS_PORT_HOST_DOMAIN: localhost
runtime_profile:
  rootfs:
    path: /opt/akernel/runtime/akernel-runtime-rootfs.img
  bootstrap:
    root: /opt/akernel/runtime/akernel-runtime-rootfs.img
