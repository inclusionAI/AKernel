# Additional standalone roles share the node Collector pipelines.
# Collector config merging replaces lists, so include the node scrape jobs too.
receivers:
  prometheus/adx:
    config:
      scrape_configs:
      - job_name: adxlet
        scrape_interval: 15s
        static_configs:
        - targets:
          - 127.0.0.1:19091
          labels:
            component_name: adxlet
      - job_name: adx-relay
        scrape_interval: 15s
        static_configs:
        - targets:
          - 127.0.0.1:18443
          labels:
            component_name: adx-relay
      - job_name: otel-collector
        scrape_interval: 30s
        # Internal batch/HTTP/RPC histograms remain available at the local endpoint.
        # Fleet health uses queue, refused, failed and process metrics.
        metric_relabel_configs:
        - source_labels: [__name__]
          action: drop
          regex: '(otelcol_processor_batch_batch_send_size(_bytes)?|http[_.](client|server)[_.]duration(_milliseconds)?|rpc[_.](client|server)[_.](duration(_milliseconds)?|(request|response)[_.]size(_bytes)?|(requests|responses)_per_rpc))(_(bucket|sum|count))?'
        static_configs:
        - targets:
          - 127.0.0.1:18889
          labels:
            component_name: otel-collector
      - job_name: adx-coordinator
        scrape_interval: 15s
        static_configs:
        - targets:
          - 127.0.0.1:19090
          labels:
            component_name: adx-coordinator
      - job_name: adx-apiserver
        scrape_interval: 15s
        static_configs:
        - targets:
          - 127.0.0.1:19093
          labels:
            component_name: adx-apiserver
      - job_name: adx-ingress
        scrape_interval: 15s
        static_configs:
        - targets:
          - 127.0.0.1:18080
          labels:
            component_name: adx-ingress
