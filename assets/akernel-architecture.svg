<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1180" viewBox="0 0 1280 1180" role="img" aria-labelledby="title description">
  <title id="title">AKernel Kubernetes architecture with Agent DX</title>
  <desc id="description">SDK and CLI clients reach ADX Ingress and API Server through optional Traefik HTTPS and HTTP entrypoints. The Coordinator manages sandbox placement; Redis holds shared state and discovery. Worker Adxlets delegate lifecycle operations to sandboxd, and their embedded Relays route sandbox traffic. Sandboxes run Execd and workloads with runsc, Kata, Firecracker or optional runc. Distill-fs provides lazy image access. Node Collectors and control Pod sidecars export telemetry to Prometheus, Loki and Tempo, queried through Grafana.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #26364a; text-anchor: middle; }
      .heading { font-size: 25px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 600; }
      .detail { font-size: 18px; }
      .note { font-size: 17px; fill: #526479; }
      .frame { fill: #f5f8fc; stroke: #c6d3e2; stroke-width: 2; }
      .box { stroke-width: 2; rx: 12; }
      .control { fill: #e4efff; stroke: #547eb9; }
      .node { fill: #e2f4ef; stroke: #4c9b8d; }
      .storage { fill: #fff2dd; stroke: #c29a58; }
      .monitor { fill: #f1eafa; stroke: #9b7abc; }
      .arrow { fill: none; stroke-width: 3; stroke-linejoin: round; }
      .lifecycle { stroke: #396aaf; marker-end: url(#blue-arrow); }
      .traffic { stroke: #19867a; marker-end: url(#teal-arrow); }
      .dependency { stroke: #8391a2; stroke-dasharray: 7 5; marker-end: url(#gray-arrow); }
      .telemetry { stroke: #9264b5; stroke-dasharray: 7 5; marker-end: url(#purple-arrow); }
    </style>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#396aaf"/>
    </marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#19867a"/>
    </marker>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8391a2"/>
    </marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9264b5"/>
    </marker>
  </defs>

  <rect width="1280" height="1180" fill="#ffffff"/>
  <rect class="frame" x="30" y="150" width="1220" height="900" rx="20"/>
  <text class="heading" x="1019" y="181">Kubernetes / cloud</text>

  <rect class="box control" x="345" y="38" width="420" height="64"/>
  <text class="label" x="555" y="77">AKernel SDK / CLI</text>
  <rect class="box monitor" x="65" y="38" width="220" height="64"/>
  <text class="label" x="175" y="77">Browser</text>
  <path class="arrow lifecycle" d="M555 102 V210"/>
  <path class="arrow dependency" d="M175 102 V275"/>

  <rect class="box control" x="345" y="210" width="420" height="76"/>
  <text class="label" x="555" y="239">Traefik (optional)</text>
  <text class="detail" x="555" y="266">HTTPS/WSS :443 · HTTP/WS :80</text>
  <path class="arrow lifecycle" d="M555 286 V315"/>

  <rect class="box control" x="345" y="315" width="420" height="142"/>
  <text class="label" x="555" y="350">ADX Ingress / API Server</text>
  <text class="detail" x="555" y="383">Public routing · sandbox APIs</text>
  <text class="note" x="555" y="418">One ingress-api Pod, two ADX roles</text>
  <path class="arrow lifecycle" d="M555 457 V514"/>

  <rect class="box control" x="345" y="514" width="420" height="82"/>
  <text class="label" x="555" y="548">ADX Coordinator</text>
  <text class="detail" x="555" y="576">Placement · resource accounting</text>
  <path class="arrow dependency" d="M555 596 V677"/>
  <path class="arrow dependency" d="M345 386 H319 V718 H345"/>

  <rect class="box storage" x="345" y="677" width="420" height="80"/>
  <text class="label" x="555" y="711">Redis</text>
  <text class="detail" x="555" y="739">Shared state · discovery</text>

  <rect class="box monitor" x="345" y="809" width="420" height="78"/>
  <text class="label" x="555" y="841">Collector sidecars</text>
  <text class="detail" x="555" y="868">Coordinator and Ingress/API Pods</text>
  <path class="arrow telemetry" d="M345 848 H306 V624 H285"/>

  <rect class="box storage" x="345" y="929" width="420" height="80"/>
  <text class="label" x="555" y="963">OCI Registry · Object Storage</text>
  <text class="detail" x="555" y="991">Rootfs images · read-only mounts</text>

  <rect class="frame" x="835" y="275" width="400" height="754" rx="16"/>
  <text class="heading" x="1035" y="306">Worker nodes (1..N)</text>
  <rect class="box node" x="855" y="328" width="328" height="129"/>
  <text class="label" x="1019" y="365">Adxlet / embedded Relay</text>
  <text class="detail" x="1019" y="397">Node control · sandbox routing</text>
  <text class="note" x="1019" y="431">Resource reporting · discovery</text>
  <path class="arrow dependency" d="M765 718 H787 V442 H855"/>
  <path class="arrow traffic" d="M765 362 H855"/>
  <path class="arrow lifecycle" d="M765 555 H810 V411 H855"/>
  <path class="arrow lifecycle" d="M1019 457 V525"/>

  <rect class="box node" x="855" y="525" width="328" height="82"/>
  <text class="label" x="1019" y="559">sandboxd</text>
  <text class="detail" x="1019" y="587">Runtime · storage · networking</text>
  <path class="arrow lifecycle" d="M1019 607 V647"/>
  <path class="arrow traffic" d="M1183 379 H1212 V752 H1183"/>

  <rect class="box node" x="855" y="647" width="328" height="176"/>
  <text class="label" x="1019" y="679">Sandbox</text>
  <text class="detail" x="1019" y="708">runsc (default) · Kata</text>
  <text class="detail" x="1019" y="735">Firecracker · runc (opt-in)</text>
  <rect x="874" y="750" width="290" height="56" rx="9" fill="#ffffff" stroke="#4c9b8d"/>
  <text class="label" x="1019" y="786">Execd + workload</text>

  <rect class="box storage" x="855" y="849" width="328" height="70"/>
  <text class="label" x="1019" y="879">distill-fs / image cache</text>
  <text class="detail" x="1019" y="905">Lazy rootfs access</text>
  <path class="arrow dependency" d="M765 969 H812 V884 H855"/>
  <path class="arrow dependency" d="M919 849 V833 H828 V569 H855"/>

  <rect class="box monitor" x="855" y="942" width="328" height="70"/>
  <text class="label" x="1019" y="972">Node OTel Collector</text>
  <text class="detail" x="1019" y="998">Metrics · logs · traces</text>
  <path class="arrow telemetry" d="M855 977 H844 V1037 H175 V645"/>

  <rect class="box monitor" x="65" y="275" width="220" height="80"/>
  <text class="label" x="175" y="311">Grafana</text>
  <text class="detail" x="175" y="339">ADX dashboards</text>
  <path class="arrow dependency" d="M175 355 V395"/>
  <rect class="box monitor" x="65" y="395" width="220" height="250"/>
  <text class="label" x="175" y="434">Prometheus</text>
  <text class="detail" x="175" y="460">Metrics</text>
  <line x1="83" y1="478" x2="267" y2="478" stroke="#cfbadf"/>
  <text class="label" x="175" y="513">Loki</text>
  <text class="detail" x="175" y="539">Logs</text>
  <line x1="83" y1="557" x2="267" y2="557" stroke="#cfbadf"/>
  <text class="label" x="175" y="592">Tempo</text>
  <text class="detail" x="175" y="618">Traces</text>

  <path class="arrow lifecycle" d="M60 1090 H105"/>
  <text class="detail" x="206" y="1096">Control / lifecycle</text>
  <path class="arrow traffic" d="M370 1090 H415"/>
  <text class="detail" x="540" y="1096">Sandbox I/O / ports</text>
  <path class="arrow telemetry" d="M710 1090 H755"/>
  <text class="detail" x="820" y="1096">Telemetry</text>
  <path class="arrow dependency" d="M955 1090 H1000"/>
  <text class="detail" x="1107" y="1096">Shared dependencies</text>
  <text class="note" x="640" y="1144">Standalone co-locates ADX roles in one all-in-one container and exposes Ingress directly.</text>
</svg>
