{{- if .Values.kruise.enabled }}
apiVersion: apps.kruise.io/v1alpha1
{{- else }}
apiVersion: apps/v1
{{- end }}
kind: StatefulSet
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitor.labels" . | nindent 4 }}
    component: prometheus
    {{- with .Values.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.prometheusServer.replicaCount }}
  serviceName: {{ .Values.prometheusServer.service.name }}
  selector:
    matchLabels:
      component: prometheus
  updateStrategy:
    type: RollingUpdate
    {{- if .Values.kruise.enabled }}
    rollingUpdate:
      podUpdatePolicy: InPlaceIfPossible
    {{- end }}
  template:
    metadata:
      annotations:
        checksum/prometheus-config: {{ include (print $.Template.BasePath "/prometheus/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "monitor.labels" . | nindent 8 }}
        component: prometheus
        {{- with .Values.extraLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Release.Name }}-prometheus
      {{- if .Values.kruise.enabled }}
      readinessGates:
      - conditionType: InPlaceUpdateReady
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      initContainers:
      - name: fix-permissions
        image: "{{ .Values.prometheusServer.image.repository }}:{{ .Values.prometheusServer.image.tag }}"
        securityContext:
          runAsUser: 0
        command:
          - sh
          - -c
          - |
            chown -R 65534:65534 /prometheus
            chmod -R 777 /prometheus
        volumeMounts:
        - name: prometheus-storage
          mountPath: /prometheus

      containers:
      - name: prometheus
        image: "{{ .Values.prometheusServer.image.repository }}:{{ .Values.prometheusServer.image.tag }}"
        imagePullPolicy: {{ .Values.prometheusServer.image.pullPolicy }}
        securityContext:
          runAsUser: 65534
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--web.console.libraries=/usr/share/prometheus/console_libraries'
          - '--web.console.templates=/usr/share/prometheus/consoles'
          - '--web.enable-lifecycle'
          - '--web.enable-remote-write-receiver'
          - '--storage.tsdb.retention.time={{ .Values.prometheusServer.config.retentionTime }}'
        ports:
        - containerPort: 9090
          name: web
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-storage
          mountPath: /prometheus
        resources:
          {{- toYaml .Values.prometheusServer.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-storage
        persistentVolumeClaim:
          claimName: {{ .Values.prometheusServer.persistence.claimName | default "prometheus-pvc-ssd" }}
