apiVersion: v1
kind: Service
metadata:
  name: akernel-adx-ingress-api
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: akernel-adx-ingress-api
  ports:
    - name: control
      port: 8443
      targetPort: control
    - name: data
      port: 8080
      targetPort: data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: akernel-adx-ingress-api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.adx.ingressApi.replicas }}
  selector:
    matchLabels:
      app: akernel-adx-ingress-api
  template:
    metadata:
      labels:
        app: akernel-adx-ingress-api
      annotations:
        checksum/otel-collector-config: {{ include (print $.Template.BasePath "/otel-configmap.yaml") . | sha256sum }}
        checksum/adx-config: {{ include (print $.Template.BasePath "/adx/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ingress-api
          image: "{{ include "core.image" (dict "root" . "image" .Values.coordinator.image) }}"
          imagePullPolicy: {{ include "core.image.pullPolicy" (dict "root" . "image" .Values.coordinator.image) }}
          command: [/opt/adx/current/bin/adxctl]
          args: [--config, /etc/akernel/adx-ingress-api.yaml, run]
          env:
            {{- if eq .Values.adx.redis.mode "managed" }}
            - name: ADX_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: akernel-adx-redis-auth
                  key: password
            {{- end }}
            - name: ADX_REDIS_URL
              {{- if eq .Values.adx.redis.mode "managed" }}
              value: redis://:$(ADX_REDIS_PASSWORD)@akernel-adx-redis.{{ .Release.Namespace }}.svc.cluster.local:6379/
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adx.redis.external.existingSecret | quote }}
                  key: {{ .Values.adx.redis.external.urlKey | quote }}
              {{- end }}
          ports:
            - name: control
              containerPort: 8443
            - name: data
              containerPort: 8080
            - name: health
              containerPort: 18080
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            timeoutSeconds: 3
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.adx.ingressApi.resources | nindent 12 }}
          volumeMounts:
            {{- if or .Values.monitoring.prometheusEndpoint .Values.monitoring.lokiEndpoint .Values.monitoring.tempoEndpoint }}
            - name: adx-logs
              mountPath: /home/akernel/adx/run/ingress-api/logs
            {{- end }}
            - name: config
              mountPath: /etc/akernel/adx-ingress-api.yaml
              subPath: ingress-api.yaml
              readOnly: true
            - name: credentials
              mountPath: /etc/adx
              readOnly: true
        {{- if or .Values.monitoring.prometheusEndpoint .Values.monitoring.lokiEndpoint .Values.monitoring.tempoEndpoint }}
        - name: otel-collector
          image: "{{ include "core.image" (dict "root" . "image" .Values.coordinator.image) }}"
          imagePullPolicy: {{ include "core.image.pullPolicy" (dict "root" . "image" .Values.coordinator.image) }}
          command: [/usr/local/bin/otelcol-contrib]
          args: [--config=/etc/otel/control.yaml]
          env:
            - {name: ADX_METRICS_TARGET, value: "127.0.0.1:18080"}
            - {name: ADX_METRICS_COMPONENT, value: adx-ingress}
            - {name: AKERNEL_ENV, value: {{ .Values.monitoring.akernelEnv | default "default" | quote }}}
            - {name: PROMETHEUS_ENDPOINT, value: {{ .Values.monitoring.prometheusEndpoint | quote }}}
            - {name: LOKI_ENDPOINT, value: {{ .Values.monitoring.lokiEndpoint | quote }}}
            - {name: TEMPO_ENDPOINT, value: {{ .Values.monitoring.tempoEndpoint | quote }}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: adx-logs, mountPath: /logs, readOnly: true}
            - {name: collector-state, mountPath: /collector-state}
            - {name: otel-config, mountPath: /etc/otel, readOnly: true}
        {{- end }}
      volumes:
        {{- if or .Values.monitoring.prometheusEndpoint .Values.monitoring.lokiEndpoint .Values.monitoring.tempoEndpoint }}
        - name: adx-logs
          emptyDir: {}
        - name: collector-state
          emptyDir: {}
        - name: otel-config
          configMap:
            name: akernel-otel-collector-config
        {{- end }}
        - name: config
          configMap:
            name: akernel-adx-config
        - name: credentials
          secret:
            secretName: {{ .Values.adx.tls.existingSecret | quote }}
            defaultMode: 0400
            items:
              - {key: public.pem, path: tls/public.pem}
              - {key: public.key, path: tls/public.key}
