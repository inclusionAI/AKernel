{{- if .Values.traefik.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-static
  namespace: {{ .Release.Namespace }}
data:
  traefik.yml: |
    entryPoints:
      websecure:
        address: ":{{ .Values.traefik.ports.websecure }}"
      web:
        address: ":{{ .Values.traefik.ports.web }}"
      traefik:
        address: ":{{ .Values.traefik.ports.dashboard }}"


    providers:
      file:
        directory: /etc/traefik/dynamic
        watch: true

    ping: {}

    api:
      dashboard: true
      insecure: true

    log:
      level: INFO
      filePath: /var/logs/traefik.log

    accessLog:
      format: json
      fields:
        names:
          # Exec places authentication data in the websocket query string.
          # Keep status and timing fields, but never persist the request path.
          RequestPath: drop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-dynamic
  namespace: {{ .Release.Namespace }}
data:
  config.yml: |
    {{- if .Values.traefik.tls.enabled }}
    tls:
      stores:
        default:
          defaultCertificate:
            certFile: /etc/akernel/tls/module.crt
            keyFile: /etc/akernel/tls/module.key
      certificates:
        - certFile: /etc/akernel/tls/module.crt
          keyFile: /etc/akernel/tls/module.key
    {{- end }}

    http:
      routers:
        adx-control:
          entryPoints:
            - websecure
          rule: "Path(`/`) || Path(`/healthz`) || PathPrefix(`/api/instances`) || PathPrefix(`/api/sandbox`) || PathPrefix(`/api/admin/v1/keys`)"
          service: akernel-adx-ingress-api
          tls: {}
        adx-data:
          entryPoints:
            - web
          rule: "PathPrefix(`/`)"
          service: akernel-adx-data
      services:
        akernel-adx-ingress-api:
          loadBalancer:
            serversTransport: adx-transport
            servers:
              - url: "https://akernel-adx-ingress-api:8443"
        akernel-adx-data:
          loadBalancer:
            servers:
              - url: "http://akernel-adx-ingress-api:8080"
      serversTransports:
        adx-transport:
          insecureSkipVerify: true
          disableHTTP2: true
{{- end }}
