{{- if .Values.traefik.enabled }}
{{- if .Values.kruise.enabled }}
apiVersion: apps.kruise.io/v1alpha1
kind: CloneSet
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: traefik
  namespace: {{ .Release.Namespace }}
  labels:
    app: traefik
spec:
  {{- if .Values.kruise.enabled }}
  updateStrategy:
    type: InPlaceIfPossible
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  {{- end }}
  replicas: {{ .Values.traefik.replicas | default 1 }}
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      {{- with .Values.traefik.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: traefik
        {{- with .Values.traefik.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.kruise.enabled }}
      readinessGates:
      - conditionType: InPlaceUpdateReady
      {{- end }}
      {{- if .Values.traefik.affinity }}
      affinity:
        {{- toYaml .Values.traefik.affinity | nindent 8 }}
      {{- else if gt (int (.Values.traefik.replicas | default 1)) 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - traefik
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.traefik.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: traefik
          image: "{{ .Values.traefik.image.repository }}:{{ .Values.traefik.image.tag }}"
          imagePullPolicy: {{ .Values.traefik.image.pullPolicy }}
          args:
            - --configFile=/etc/traefik/traefik.yml
          ports:
            - name: websecure
              containerPort: {{ .Values.traefik.ports.websecure }}
            - name: web
              containerPort: {{ .Values.traefik.ports.web }}
            - name: dashboard
              containerPort: {{ .Values.traefik.ports.dashboard }}
          livenessProbe:
            httpGet:
              path: /ping
              port: dashboard
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: dashboard
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: static-config
              mountPath: /etc/traefik/traefik.yml
              subPath: traefik.yml
              readOnly: true
            - name: dynamic-config
              mountPath: /etc/traefik/dynamic
              readOnly: true
            - name: logs
              mountPath: /var/logs
            {{- if .Values.traefik.tls.enabled }}
            - name: tls-cert
              mountPath: /etc/akernel/tls
              readOnly: true
            {{- end }}
        {{- if .Values.traefik.internalStats.enabled }}
        - name: internal-stats
          image: "{{ .Values.traefik.internalStats.image }}"
          command: ['sh', '-c', 'mkdir -p /var/www && echo "{\"pod_ip\":\"$POD_IP\"}" > /var/www/index.html && httpd -f -p {{ .Values.traefik.internalStats.port }} -h /var/www']
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: internal-stats
              containerPort: {{ .Values.traefik.internalStats.port }}
        {{- end }}
      volumes:
        - name: static-config
          configMap:
            name: traefik-static
        - name: dynamic-config
          configMap:
            name: traefik-dynamic
        - name: logs
          emptyDir: {}
        {{- if .Values.traefik.tls.enabled }}
        - name: tls-cert
          secret:
            secretName: {{ .Values.traefik.tls.secretName | default "traefik-tls" }}
            optional: false
        {{- end }}
{{- end }}
