{{- if .Values.frontend.enabled }}
{{- if .Values.kruise.enabled }}
apiVersion: apps.kruise.io/v1alpha1
kind: CloneSet
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: akernel-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: akernel-frontend
    {{- with .Values.frontend.podLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.kruise.enabled }}
  updateStrategy:
    type: ReCreate
    maxUnavailable: 100%
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  {{- end }}
  replicas: {{ .Values.frontend.replicas | default 2 }}
  selector:
    matchLabels:
      app: akernel-frontend
  template:
    metadata:
      annotations:
        checksum/litebus-secret: {{ include "core.litebusSecretChecksum" . }}
        {{- with .Values.frontend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app: akernel-frontend
        {{- if .Values.frontend.podLabels }}
        {{- toYaml .Values.frontend.podLabels | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.kruise.enabled }}
      readinessGates:
      - conditionType: InPlaceUpdateReady
      {{- end }}
      {{- $frontendEtcd := .Values.frontend.etcd | default dict }}
      {{- if .Values.frontend.affinity }}
      affinity:
        {{- toYaml .Values.frontend.affinity | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - akernel-frontend
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.frontend.dnsConfig }}
      dnsConfig:
        {{- toYaml .Values.frontend.dnsConfig | nindent 8 }}
      dnsPolicy: None
      {{- else }}
      dnsPolicy: ClusterFirst
      {{- end }}
      containers:
        - name: akernel-frontend
          image: "{{ include "core.image" (dict "root" . "image" .Values.frontend.image) }}"
          imagePullPolicy: {{ include "core.image.pullPolicy" (dict "root" . "image" .Values.frontend.image) }}
          command:
            - /usr/local/bin/akernel-entrypoint
          env:
            - name: AKERNEL_ROLE
              value: "frontend"
            - name: LITEBUS_DATA_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "core.litebusSecretName" . }}
                  key: litebus-data-key
            - name: ENABLE_FUNCTION_MASTER
              value: "false"
            - name: ENABLE_FUNCTION_SCHEDULER
              value: "false"
            - name: ENABLE_META_SERVICE
              value: "false"
            - name: ENABLE_IAM_SERVER
              value: "true"
            - name: ENABLE_SANDBOX_ROUTER
              value: {{ not .Values.dataPlane.enabled | quote }}
            {{- if .Values.dataPlane.enabled }}
            # The frontend has no sandboxd/node-proxy. Advertising worker
            # capacity here lets the global scheduler place sandboxes on a
            # control-plane-only agent, where runtime creation fails.
            - name: YR_CPU_NUM_MILLICORES
              value: "0"
            - name: YR_MEMORY_NUM_MB
              value: "0"
            {{- end }}
            {{- if and .Values.dataPlane.enabled .Values.dataPlane.edge.enabled }}
            - name: ENABLE_EDGE_FRONTEND
              value: "true"
            - name: INSTANCE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: YR_ETCD_ADDR_LIST
              value: {{ printf "akernel-etcd.%s.svc.cluster.local:%v" .Release.Namespace (get $frontendEtcd "port" | default "2379") | quote }}
            - name: YR_DATA_SYSTEM_CLUSTER_NAME
              value: {{ .Values.dataPlane.clusterName | quote }}
            - name: YR_DATA_PLANE_EDGE_FRONTEND_TLS_BIND
              value: {{ printf "0.0.0.0:%v" .Values.dataPlane.edge.tlsPort | quote }}
            - name: YR_DATA_PLANE_EDGE_FRONTEND_PLAIN_BIND
              value: {{ printf "0.0.0.0:%v" .Values.dataPlane.edge.plainPort | quote }}
            - name: YR_DATA_PLANE_EDGE_FRONTEND_HEALTH_BIND
              value: {{ printf "0.0.0.0:%v" .Values.dataPlane.edge.healthPort | quote }}
            - name: YR_DATA_PLANE_EDGE_FRONTEND_CONTROL_PLANE_ADDRESS
              value: "$(INSTANCE_IP):8888"
            - name: YR_DATA_PLANE_EDGE_FRONTEND_IAM_ADDRESS
              value: "$(INSTANCE_IP):31112"
            - name: YR_DATA_PLANE_EDGE_FRONTEND_VALIDATE_IAM
              value: {{ .Values.dataPlane.edge.validateIam | quote }}
            - name: YR_DATA_PLANE_EDGE_FRONTEND_ACCESS_LOG_ENABLED
              value: {{ .Values.dataPlane.edge.accessLogEnabled | quote }}
            - name: YR_DATA_PLANE_EDGE_FRONTEND_AUDIT_LOG_ENABLED
              value: {{ .Values.dataPlane.edge.auditLogEnabled | quote }}
            - name: YR_DATA_PLANE_EDGE_FRONTEND_ALLOWED_CLIENT_CIDRS
              value: {{ join "," .Values.dataPlane.edge.allowedClientCidrs | quote }}
            - name: YR_DATA_PLANE_EDGE_FRONTEND_ALLOW_ANY_CLIENT
              value: {{ .Values.dataPlane.edge.allowAnyClient | quote }}
            - name: YR_DATA_PLANE_EDGE_FRONTEND_NODE_SECURITY_MODE
              value: {{ .Values.dataPlane.node.securityMode | quote }}
            {{- end }}
            - name: META_SERVICE_ADDRESS
              value: {{ .Values.frontend.master.metaServiceAddress | default (printf "akernel-master.%s.svc.cluster.local:31111" .Release.Namespace) | quote }}
            - name: IAM_SERVER_ADDRESS
              value: {{ .Values.frontend.master.iamServerAddress | default (printf "akernel-master.%s.svc.cluster.local:31112" .Release.Namespace) | quote }}
            - name: ETCD_ADDRESS
              value: {{ get $frontendEtcd "host" | default (printf "akernel-etcd.%s.svc.cluster.local" .Release.Namespace) | quote }}
            - name: ETCD_PORT
              value: {{ get $frontendEtcd "port" | default "2379" | quote }}
            {{- if .Values.monitoring.prometheusEndpoint }}
            - name: PROMETHEUS_ENDPOINT
              value: {{ .Values.monitoring.prometheusEndpoint | quote }}
            {{- end }}
            {{- if .Values.monitoring.lokiEndpoint }}
            - name: LOKI_ENDPOINT
              value: {{ .Values.monitoring.lokiEndpoint | quote }}
            {{- end }}
            {{- if .Values.monitoring.tempoEndpoint }}
            - name: TEMPO_ENDPOINT
              value: {{ .Values.monitoring.tempoEndpoint | quote }}
            {{- end }}
            - name: AKERNEL_ENV
              value: {{ .Values.monitoring.akernelEnv | default "default" | quote }}
            - name: ENABLE_METRICS
              value: {{ ne (.Values.monitoring.prometheusEndpoint | default "") "" | ternary "true" "false" | quote }}
            - name: ENABLE_TRACE
              value: {{ ne (.Values.monitoring.tempoEndpoint | default "") "" | ternary "true" "false" | quote }}
          ports:
            - name: http
              containerPort: 8888
            - name: iam
              containerPort: 31112
            {{- if and .Values.dataPlane.enabled .Values.dataPlane.edge.enabled }}
            - name: edge-tls
              containerPort: {{ .Values.dataPlane.edge.tlsPort }}
              protocol: TCP
            - name: edge-plain
              containerPort: {{ .Values.dataPlane.edge.plainPort }}
              protocol: TCP
            - name: edge-health
              containerPort: {{ .Values.dataPlane.edge.healthPort }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              {{- if and .Values.dataPlane.enabled .Values.dataPlane.edge.enabled }}
              port: edge-health
              scheme: HTTP
              {{- else }}
              port: 8888
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              {{- if and .Values.dataPlane.enabled .Values.dataPlane.edge.enabled }}
              path: /readyz
              port: edge-health
              scheme: HTTP
              {{- else }}
              path: /healthz
              port: 8888
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - name: component-tls
              mountPath: /home/yuanrong/.cert
              readOnly: true
          {{- if or .Values.monitoring.prometheusEndpoint .Values.monitoring.lokiEndpoint .Values.monitoring.tempoEndpoint }}
            - name: otel-collector-config
              mountPath: /etc/otel-collector
              readOnly: true
          {{- end }}
      volumes:
        - name: component-tls
          secret:
            secretName: {{ include "core.componentTLSSecretName" . }}
            defaultMode: 0400
      {{- if or .Values.monitoring.prometheusEndpoint .Values.monitoring.lokiEndpoint .Values.monitoring.tempoEndpoint }}
        - name: otel-collector-config
          configMap:
            name: akernel-otel-collector-config
      {{- end }}
{{- end }}
