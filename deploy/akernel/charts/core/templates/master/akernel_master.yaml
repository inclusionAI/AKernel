{{- if .Values.kruise.enabled }}
apiVersion: apps.kruise.io/v1alpha1
{{- else }}
apiVersion: apps/v1
{{- end }}
kind: StatefulSet
metadata:
  name: akernel-master
  namespace: {{ .Release.Namespace }}
  labels:
    app: akernel-master
    {{- with .Values.master.podLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  updateStrategy:
    {{- if .Values.kruise.enabled }}
    rollingUpdate:
      podUpdatePolicy: ReCreate
    {{- end }}
  replicas: {{ .Values.master.replicas }}
  selector:
    matchLabels:
      app: akernel-master
  template:
    metadata:
      annotations:
        checksum/litebus-secret: {{ include "core.litebusSecretChecksum" . }}
        {{- with .Values.master.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app: akernel-master
        {{- if .Values.master.podLabels }}
        {{- toYaml .Values.master.podLabels | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.kruise.enabled }}
      readinessGates:
      - conditionType: InPlaceUpdateReady
      {{- end }}
      {{- $masterEtcd := .Values.master.etcd | default dict }}
      {{- if .Values.master.affinity }}
      affinity:
        {{- toYaml .Values.master.affinity | nindent 8 }}
      {{- else if and .Values.frontend.enabled (gt (int (default 1 .Values.master.replicas)) 1) }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - akernel-master
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.master.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.master.dnsConfig }}
      dnsConfig:
        {{- toYaml .Values.master.dnsConfig | nindent 8 }}
      dnsPolicy: None
      {{- else }}
      dnsPolicy: ClusterFirst
      {{- end }}
      containers:
        - name: akernel-master
          image: "{{ include "core.image" (dict "root" . "image" .Values.master.image) }}"
          imagePullPolicy: {{ include "core.image.pullPolicy" (dict "root" . "image" .Values.master.image) }}
          command:
            - /usr/local/bin/akernel-entrypoint
          env:
            - name: AKERNEL_ROLE
              value: "master"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            {{- if .Values.frontend.enabled }}
            - name: ENABLE_FAAS_FRONTEND
              value: "false"
            - name: ENABLE_IAM_SERVER
              value: "false"
            {{- end }}
            - name: LITEBUS_DATA_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "core.litebusSecretName" . }}
                  key: litebus-data-key
            - name: ETCD_ADDRESS
              value: {{ get $masterEtcd "host" | default (printf "akernel-etcd.%s.svc.cluster.local" .Release.Namespace) | quote }}
            - name: ETCD_PORT
              value: {{ get $masterEtcd "port" | default "2379" | quote }}
            {{- if .Values.monitoring.prometheusEndpoint }}
            - name: PROMETHEUS_ENDPOINT
              value: {{ .Values.monitoring.prometheusEndpoint | quote }}
            {{- end }}
            {{- if .Values.monitoring.lokiEndpoint }}
            - name: LOKI_ENDPOINT
              value: {{ .Values.monitoring.lokiEndpoint | quote }}
            {{- end }}
            {{- if .Values.monitoring.tempoEndpoint }}
            - name: TEMPO_ENDPOINT
              value: {{ .Values.monitoring.tempoEndpoint | quote }}
            {{- end }}
            - name: AKERNEL_ENV
              value: {{ .Values.monitoring.akernelEnv | default "default" | quote }}
            - name: ENABLE_METRICS
              value: {{ ne (.Values.monitoring.prometheusEndpoint | default "") "" | ternary "true" "false" | quote }}
            - name: ENABLE_TRACE
              value: {{ ne (.Values.monitoring.tempoEndpoint | default "") "" | ternary "true" "false" | quote }}
            - name: TRAEFIK_MODE
              value: {{ .Values.traefik.mode | default "http" | quote }}
            - name: TRAEFIK_ENABLE_TLS
              value: {{ .Values.traefik.enableWebEntrypoint | default false | ternary false (.Values.traefik.enableTLS | default false) | quote }}
            - name: TRAEFIK_HTTP_ENTRYPOINT
              value: {{ .Values.traefik.enableWebEntrypoint | default false | ternary "web" "websecure" | quote }}
          ports:
            - name: http
              containerPort: 8888
            - name: metaservice
              containerPort: 31111
            - name: global-sched
              containerPort: 22770
          livenessProbe:
            tcpSocket:
              port: 22770
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 22770
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.master.resources | nindent 12 }}
          volumeMounts:
            - name: component-tls
              mountPath: /home/yuanrong/.cert
              readOnly: true
          {{- if or .Values.monitoring.prometheusEndpoint .Values.monitoring.lokiEndpoint .Values.monitoring.tempoEndpoint }}
            - name: otel-collector-config
              mountPath: /etc/otel-collector
              readOnly: true
          {{- end }}
      volumes:
        - name: component-tls
          secret:
            secretName: {{ include "core.componentTLSSecretName" . }}
            defaultMode: 0400
      {{- if or .Values.monitoring.prometheusEndpoint .Values.monitoring.lokiEndpoint .Values.monitoring.tempoEndpoint }}
        - name: otel-collector-config
          configMap:
            name: akernel-otel-collector-config
      {{- end }}
