{{- if ne (int .Values.etcd.replicas) 1 }}
{{- fail "the bundled etcd chart supports exactly one member; use an external HA etcd deployment for multiple replicas" }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: akernel-etcd
  namespace: {{ .Release.Namespace }}
  labels:
    app: etcd
    {{- with .Values.etcd.podLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  serviceName: akernel-etcd
  replicas: {{ .Values.etcd.replicas }}
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
        {{- if .Values.etcd.podLabels }}
        {{- toYaml .Values.etcd.podLabels | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.etcd.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.etcd.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.etcd.volumePermissions.enabled }}
      initContainers:
        - name: init-etcd-permissions
          image: "{{ .Values.etcd.volumePermissions.image }}"
          imagePullPolicy: {{ .Values.etcd.volumePermissions.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p {{ .Values.etcd.dataDir }}
              chown -R {{ .Values.etcd.volumePermissions.dataUser }}:{{ .Values.etcd.volumePermissions.dataUser }} {{ .Values.etcd.dataDir }}
              chmod 0700 {{ .Values.etcd.dataDir }}
          securityContext:
            runAsUser: {{ .Values.etcd.volumePermissions.runAsUser }}
          volumeMounts:
            - name: etcd-data
              mountPath: {{ .Values.etcd.dataDir }}
      {{- end }}
      containers:
        - name: etcd
          image: "{{ .Values.etcd.image.repository }}:{{ .Values.etcd.image.tag }}"
          imagePullPolicy: {{ .Values.etcd.image.pullPolicy }}
          command:
            - /usr/local/bin/etcd
          args:
            - --name=etcd0
            - --data-dir={{ .Values.etcd.dataDir }}
            - --auto-compaction-mode=revision
            - --auto-compaction-retention={{ .Values.etcd.args.autoCompactionRetention }}
            - --quota-backend-bytes={{ .Values.etcd.args.quotaBackendBytes }}
            - --listen-client-urls=http://$(MY_POD_IP):2379
            - --advertise-client-urls=http://$(MY_POD_IP):2379
            - --listen-peer-urls=http://$(MY_POD_IP):2378
            - --initial-advertise-peer-urls=http://$(MY_POD_IP):2378
            - --initial-cluster=etcd0=http://$(MY_POD_IP):2378
            - --initial-cluster-state=new
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.etcd.volumePermissions.dataUser }}
            runAsGroup: {{ .Values.etcd.volumePermissions.dataUser }}
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: client
              containerPort: 2379
            - name: peer
              containerPort: 2378
          readinessProbe:
            httpGet:
              path: /health
              port: client
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: etcd-data
              mountPath: {{ .Values.etcd.dataDir }}
          resources:
            {{- toYaml .Values.etcd.resources | nindent 12 }}
      {{- if not .Values.etcd.persistence.enabled }}
      volumes:
        - name: etcd-data
          emptyDir: {}
      {{- end }}
  {{- if .Values.etcd.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes:
          {{- toYaml .Values.etcd.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.etcd.persistence.size | quote }}
        {{- if .Values.etcd.persistence.storageClassName }}
        storageClassName: {{ .Values.etcd.persistence.storageClassName | quote }}
        {{- end }}
  {{- end }}
