{{- $logs := .Values.node.applicationLogs }}
{{- if $logs.enabled }}
{{- if or (not (regexMatch "^(/[A-Za-z0-9_-]+)+$" $logs.dataDiskRoot)) (not (regexMatch "^[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*$" $logs.relativePath)) (not (regexMatch "^[0-7]{4}$" $logs.mode)) }}
{{- fail "applicationLogs requires a dedicated absolute disk root, safe relative directory and four-digit mode" }}
{{- end }}
{{- if and $logs.legacyMountPath (not (regexMatch "^/home/akernel/[A-Za-z0-9_-]+$" $logs.legacyMountPath)) }}
{{- fail "temporary legacy log mount must be one non-system directory beneath /home/akernel" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: akernel-node-config
  namespace: {{ .Release.Namespace }}
data:
  config.json: |
{{- if and .Values.node.applicationLogs.enabled .Values.node.applicationLogs.mountInSandbox }}
{{- $oci := .Values.node.config.ociConfig | fromJson }}
{{- range ($oci.mounts | default list) }}
{{- if eq .destination "/app/logs" }}{{ fail "applicationLogs owns /app/logs: remove a duplicate OCI baseline mount" }}{{- end }}
{{- end }}
{{- $_ := set $oci "mounts" (append ($oci.mounts | default list) (dict "destination" "/app/logs" "source" "/app/logs" "type" "bind" "options" (list "rbind" "rw" "rprivate"))) }}
{{ $oci | toPrettyJson | indent 4 }}
{{- else }}
{{ .Values.node.config.ociConfig | indent 4 }}
{{- end }}

  service-resource-control.conf: |
    [Slice]
    MemoryLimit={{ .Values.node.config.resourceControl.memoryLimit | default "8G" }}
    CPUQuota={{ .Values.node.config.resourceControl.cpuQuota | default "800%" }}

  sandboxd_config.toml: |
{{- $sandboxdConfig := .Values.node.config.sandboxd.config }}
{{- $saveMode := .Values.node.config.sandboxd.runscCheckpointMode | default "full" }}
{{- $nativeFilestore := eq (toString (.Values.node.config.sandboxd.nativeFilestore | default false)) "true" }}
{{- if not (has $saveMode (list "full" "reflink")) }}
{{- fail "node.config.sandboxd.runscCheckpointMode must be full or reflink" }}
{{- end }}
{{- if eq $saveMode "reflink" }}
{{- $localInputs := has .Values.adx.checkpointStorage.kind (list "local" "s3") }}
{{- if not (and $nativeFilestore $localInputs) }}
{{- fail "runsc reflink requires nativeFilestore and node-local checkpoint inputs (local or s3)" }}
{{- end }}
{{- if not (contains "# AKERNEL_RUNSC_CHECKPOINT_MODE" $sandboxdConfig) }}
{{- fail "runsc reflink requires the # AKERNEL_RUNSC_CHECKPOINT_MODE marker in sandboxd.config" }}
{{- end }}
{{- $sandboxdConfig = replace "# AKERNEL_RUNSC_CHECKPOINT_MODE" "checkpoint_mode=\"reflink\"" $sandboxdConfig }}
{{- end }}
{{- if $nativeFilestore }}
{{- if not (regexMatch "(?m)^[\\t ]*filestore_dir_size=.*# AKERNEL_NATIVE_FILESTORE$" $sandboxdConfig) }}
{{- fail "nativeFilestore requires the filestore_dir_size # AKERNEL_NATIVE_FILESTORE marker in sandboxd.config" }}
{{- end }}
{{- $sandboxdConfig = regexReplaceAll "(?m)^([\\t ]*)filestore_dir_size=.*# AKERNEL_NATIVE_FILESTORE$" $sandboxdConfig "${1}filestore_dir_size=\"\" # Native node filesystem" }}
{{- end }}
{{- $firecrackerBackend := .Values.node.config.sandboxd.firecrackerBackend | default "kvm" }}
{{- if not (has $firecrackerBackend (list "kvm" "pvm")) }}
{{- fail "node.config.sandboxd.firecrackerBackend must be kvm or pvm" }}
{{- end }}
{{- if eq $firecrackerBackend "pvm" }}
{{- if not (and (contains "[plugin.runtime.firecracker]" $sandboxdConfig) (contains "firecracker=\"/usr/local/bin/firecracker\"" $sandboxdConfig)) }}
{{- fail "PVM selection requires the standard Firecracker config section and binary entry" }}
{{- end }}
{{- $sandboxdConfig = regexReplaceAll "(?m)^([\\t ]*)firecracker=" $sandboxdConfig "${1}firecracker-pvm=" }}
{{- $sandboxdConfig = replace "[plugin.runtime.firecracker]" "[plugin.runtime.firecracker_pvm]" $sandboxdConfig }}
{{- $sandboxdConfig = regexReplaceAll "(?m)^[\\t ]*kata=.*$" $sandboxdConfig "# Kata is disabled on the PVM node profile." }}
{{- end }}
{{- $runcMarker := "# AKERNEL_RUNTIME_RUNC" }}
{{- if .Values.node.config.sandboxd.enableRunc }}
{{- if not (contains $runcMarker $sandboxdConfig) }}
{{- fail "node.config.sandboxd.enableRunc requires the # AKERNEL_RUNTIME_RUNC marker in node.config.sandboxd.config" }}
{{- end }}
{{- $sandboxdConfig = replace $runcMarker "runc=\"/usr/local/bin/runc\"" $sandboxdConfig }}
{{- end }}
{{- $chunkDbSize := .Values.node.config.sandboxd.chunkDbSize | default "" }}
{{- if $chunkDbSize }}
{{- if not (regexMatch "^[0-9]+(B|KiB|MiB|GiB|TiB)?$" $chunkDbSize) }}
{{- fail "node.config.sandboxd.chunkDbSize must be whole bytes or an integer with B/KiB/MiB/GiB/TiB" }}
{{- end }}
{{- $chunkDbMarker := "# AKERNEL_CHUNK_DB_SIZE" }}
{{- if not (contains $chunkDbMarker $sandboxdConfig) }}
{{- fail "node.config.sandboxd.chunkDbSize requires the # AKERNEL_CHUNK_DB_SIZE marker in node.config.sandboxd.config" }}
{{- end }}
{{- $sandboxdConfig = replace $chunkDbMarker (printf "chunk_db_size=%s" ($chunkDbSize | quote)) $sandboxdConfig }}
{{- end }}
{{ $sandboxdConfig | indent 4 }}

  registry.json: |
{{ .Values.node.config.registry | toPrettyJson | indent 4 }}

  oss.json: |
{{ .Values.node.config.oss | toPrettyJson | indent 4 }}

  prepare_node.sh: |
{{ .Files.Get "scripts/prepare_node.sh" | indent 4 }}
{{- if (.Values.node.directoryHelper | default dict).enabled }}

  prepare-node-directories.py: |
{{ .Files.Get "scripts/prepare-node-directories.py" | indent 4 }}
{{- end }}

  prepare_checkpoint_storage.py: |
{{ .Files.Get "scripts/prepare_checkpoint_storage.py" | indent 4 }}
{{- if (.Values.node.runtimeRootfsPin | default dict).enabled }}

  pin-runtime-rootfs.py: |
{{ .Files.Get "scripts/pin-runtime-rootfs.py" | indent 4 }}
{{- end }}

{{- if .Values.node.applicationLogs.enabled }}

  prepare-application-logs.py: |
{{ .Files.Get "scripts/prepare-application-logs.py" | indent 4 }}
{{- end }}
