apiVersion: v1
kind: ConfigMap
metadata:
  name: akernel-node-config
  namespace: {{ .Release.Namespace }}
data:
  config.json: |
{{ .Values.node.config.ociConfig | indent 4 }}

  service-resource-control.conf: |
    [Slice]
    MemoryLimit={{ .Values.node.config.resourceControl.memoryLimit | default "8G" }}
    CPUQuota={{ .Values.node.config.resourceControl.cpuQuota | default "800%" }}

  sandboxd_config.toml: |
{{- $sandboxdConfig := .Values.node.config.sandboxd.config }}
{{- $runscCheckpointMode := .Values.node.config.sandboxd.runscCheckpointMode | default "" }}
{{- if $runscCheckpointMode }}
{{- if not (has $runscCheckpointMode (list "full" "reflink")) }}
{{- fail "node.config.sandboxd.runscCheckpointMode must be full or reflink" }}
{{- end }}
{{- $runscCheckpointMarker := "# AKERNEL_RUNSC_CHECKPOINT_MODE" }}
{{- if not (contains $runscCheckpointMarker $sandboxdConfig) }}
{{- fail "node.config.sandboxd.runscCheckpointMode requires the # AKERNEL_RUNSC_CHECKPOINT_MODE marker in node.config.sandboxd.config" }}
{{- end }}
{{- $sandboxdConfig = replace $runscCheckpointMarker (printf "checkpoint_mode=%s" ($runscCheckpointMode | quote)) $sandboxdConfig }}
{{- end }}
{{- $firecrackerBackend := .Values.node.config.sandboxd.firecrackerBackend | default "kvm" }}
{{- if not (has $firecrackerBackend (list "kvm" "pvm")) }}
{{- fail "node.config.sandboxd.firecrackerBackend must be kvm or pvm" }}
{{- end }}
{{- if eq $firecrackerBackend "pvm" }}
{{- if not (and (contains "[plugin.runtime.firecracker]" $sandboxdConfig) (contains "firecracker=\"/usr/local/bin/firecracker\"" $sandboxdConfig)) }}
{{- fail "PVM selection requires the standard Firecracker config section and binary entry" }}
{{- end }}
{{- $sandboxdConfig = regexReplaceAll "(?m)^([\\t ]*)firecracker=" $sandboxdConfig "${1}firecracker-pvm=" }}
{{- $sandboxdConfig = replace "[plugin.runtime.firecracker]" "[plugin.runtime.firecracker_pvm]" $sandboxdConfig }}
{{- $sandboxdConfig = regexReplaceAll "(?m)^[\\t ]*kata=.*$" $sandboxdConfig "# Kata is disabled on the PVM node profile." }}
{{- end }}
{{- $runcMarker := "# AKERNEL_RUNTIME_RUNC" }}
{{- if .Values.node.config.sandboxd.enableRunc }}
{{- if not (contains $runcMarker $sandboxdConfig) }}
{{- fail "node.config.sandboxd.enableRunc requires the # AKERNEL_RUNTIME_RUNC marker in node.config.sandboxd.config" }}
{{- end }}
{{- $sandboxdConfig = replace $runcMarker "runc=\"/usr/local/bin/runc\"" $sandboxdConfig }}
{{- end }}
{{- $chunkDbSize := .Values.node.config.sandboxd.chunkDbSize | default "" }}
{{- if $chunkDbSize }}
{{- if not (regexMatch "^[0-9]+(B|KiB|MiB|GiB|TiB)?$" $chunkDbSize) }}
{{- fail "node.config.sandboxd.chunkDbSize must be whole bytes or an integer with B/KiB/MiB/GiB/TiB" }}
{{- end }}
{{- $chunkDbMarker := "# AKERNEL_CHUNK_DB_SIZE" }}
{{- if not (contains $chunkDbMarker $sandboxdConfig) }}
{{- fail "node.config.sandboxd.chunkDbSize requires the # AKERNEL_CHUNK_DB_SIZE marker in node.config.sandboxd.config" }}
{{- end }}
{{- $sandboxdConfig = replace $chunkDbMarker (printf "chunk_db_size=%s" ($chunkDbSize | quote)) $sandboxdConfig }}
{{- end }}
{{ $sandboxdConfig | indent 4 }}

  registry.json: |
{{ .Values.node.config.registry | toPrettyJson | indent 4 }}

  oss.json: |
{{ .Values.node.config.oss | toPrettyJson | indent 4 }}

  prepare_node.sh: |
{{ .Files.Get "scripts/prepare_node.sh" | indent 4 }}
{{- if (.Values.node.directoryHelper | default dict).enabled }}

  prepare-node-directories.py: |
{{ .Files.Get "scripts/prepare-node-directories.py" | indent 4 }}
{{- end }}

  prepare_checkpoint_storage.py: |
{{ .Files.Get "scripts/prepare_checkpoint_storage.py" | indent 4 }}
