{{- if .Values.kruise.enabled }}
apiVersion: apps.kruise.io/v1alpha1
{{- else }}
apiVersion: apps/v1
{{- end }}
kind: DaemonSet
metadata:
  name: akernel-node
  namespace: {{ .Release.Namespace }}
  {{- with .Values.node.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  annotations:
    app: node
    {{- with .Values.node.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  updateStrategy:
    {{- if .Values.kruise.enabled }}
    rollingUpdate:
      rollingUpdateType: Standard
      maxUnavailable: 200
      partition: 0
    {{- else }}
    rollingUpdate:
      maxUnavailable: 200
    {{- end }}
    type: RollingUpdate
  selector:
    matchLabels:
      app: node
  template:
    metadata:
      labels:
        app: node
        {{- with .Values.node.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/node-config: {{ include (print $.Template.BasePath "/node/configmap.yaml") . | sha256sum }}
        checksum/adx-config: {{ include (print $.Template.BasePath "/adx/configmap.yaml") . | sha256sum }}
        checksum/otel-collector-config: {{ include (print $.Template.BasePath "/otel-configmap.yaml") . | sha256sum }}
        {{- with .Values.node.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "core.serviceAccountName" . }}
      {{- with .Values.node.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate-adx-state
          image: "{{ include "core.image" (dict "root" . "image" .Values.node.image) }}"
          imagePullPolicy: {{ include "core.image.pullPolicy" (dict "root" . "image" .Values.node.image) }}
          command:
            - /bin/bash
            - -ec
            - |
              rm -rf -- /home/akernel/adx/run/control
              for path in /home/akernel/adx/run/config-[0-9]*; do
                [[ -d "${path}" ]] || continue
                suffix="${path##*/config-}"
                [[ -n "${suffix}" && "${suffix}" != *[!0-9]* ]] || continue
                rm -rf -- "${path}"
              done
          volumeMounts:
            - mountPath: /home/akernel
              name: home-disk
      {{- with .Values.node.initContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: akernel-node
        image: "{{ include "core.image" (dict "root" . "image" .Values.node.image) }}"
        imagePullPolicy: {{ include "core.image.pullPolicy" (dict "root" . "image" .Values.node.image) }}
        command:
        - /usr/local/bin/akernel-entrypoint
        lifecycle:
          postStart:
            exec:
              command:
              - bash
              - -c
              - |
                cp /etc/resolv.conf /etc/resolv_akernel.conf && sed -i 's/127.0.0.1/10.88.0.1/g' /etc/resolv_akernel.conf
        resources:
          {{- toYaml .Values.node.resources | nindent 10 }}
        env:
        # Required for systemd shutdown safety, including with older images.
        - name: container
          value: "oci"
        - name: AKERNEL_ROLE
          value: "node"
        - name: AKERNEL_ADX_CONFIG
          value: /etc/akernel/adx-node.yaml
        - name: AKERNEL_ADX_MANAGED_CREDENTIALS
          value: external
        {{- if eq .Values.adx.redis.mode "managed" }}
        - name: ADX_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: akernel-adx-redis-auth
              key: password
        {{- end }}
        - name: ADX_REDIS_URL
          {{- if eq .Values.adx.redis.mode "managed" }}
          value: redis://:$(ADX_REDIS_PASSWORD)@akernel-adx-redis.{{ .Release.Namespace }}.svc.cluster.local:6379/
          {{- else }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.adx.redis.external.existingSecret | quote }}
              key: {{ .Values.adx.redis.external.urlKey | quote }}
          {{- end }}
        - name: RUNSC_AKERNEL
          value: "1"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: INSTANCE_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        {{- if .Values.monitoring.prometheusEndpoint }}
        - name: PROMETHEUS_ENDPOINT
          value: {{ .Values.monitoring.prometheusEndpoint | quote }}
        {{- end }}
        {{- if .Values.monitoring.lokiEndpoint }}
        - name: LOKI_ENDPOINT
          value: {{ .Values.monitoring.lokiEndpoint | quote }}
        {{- end }}
        {{- if .Values.monitoring.tempoEndpoint }}
        - name: TEMPO_ENDPOINT
          value: {{ .Values.monitoring.tempoEndpoint | quote }}
        {{- end }}
        - name: AKERNEL_ENV
          value: {{ .Values.monitoring.akernelEnv | default "default" | quote }}
        securityContext:
          privileged: true
        volumeMounts:
        # image-manager / resource-manager input configs live under
        # /home/akernel/sandboxd/config/, disjoint from the image_manager runtime
        # root that sandboxd wipes on pod change. Paths line up with the
        # values.yaml [plugin.image] / [plugin.node_resource] sections.
        - mountPath: /home/akernel/sandboxd/config/oss_auths.json
          readOnly: true
          name: akernel-secrets
          subPath: oss_auths.json
        - mountPath: /home/akernel/sandboxd/config/registry_auths.json
          readOnly: true
          name: akernel-secrets
          subPath: registry_auths.json
        - mountPath: /home/akernel/sandboxd/config/registry.json
          readOnly: true
          name: akernel-node-config
          subPath: registry.json
        - mountPath: /home/akernel/sandboxd/config/oss.json
          readOnly: true
          name: akernel-node-config
          subPath: oss.json
        - mountPath: /home/akernel/images/config.json
          name: akernel-node-config
          subPath: config.json
        - mountPath: /dev/shm
          name: shm
        - mountPath: /etc/systemd/system/system.slice.d/service-resource-control.conf
          name: akernel-node-config
          subPath: service-resource-control.conf
        - mountPath: /root/prepare_node.sh
          readOnly: true
          name: akernel-node-bootstrap
          subPath: prepare_node.sh
        # sandboxd reads its config at /home/akernel/sandboxd/config.toml; keep this
        # mount and the unit file's `-config` flag in sync.
        - mountPath: /home/akernel/sandboxd/config.toml
          name: akernel-node-config
          subPath: sandboxd_config.toml
        - mountPath: /home/akernel
          name: home-disk
          {{- if not .Values.node.homeDisk.useEphemeralPVC }}
          mountPropagation: HostToContainer
          {{- end }}
        - mountPath: /etc/akernel/adx-node.yaml
          name: adx-config
          subPath: node.yaml
          readOnly: true
        {{- if or $.Values.monitoring.prometheusEndpoint $.Values.monitoring.lokiEndpoint $.Values.monitoring.tempoEndpoint }}
        - mountPath: /etc/otel-collector
          name: otel-collector-config
          readOnly: true
        {{- end }}
      {{- if .Values.node.dnsConfig }}
      dnsConfig:
        {{- toYaml .Values.node.dnsConfig | nindent 8 }}
      dnsPolicy: None
      {{- else }}
      dnsPolicy: ClusterFirst
      {{- end }}
      tolerations:
      - operator: "Exists"
      volumes:
      - name: akernel-secrets
        secret:
          secretName: akernel-secrets
          defaultMode: 0400
      - name: akernel-node-config
        configMap:
          name: akernel-node-config
      - name: akernel-node-bootstrap
        configMap:
          name: akernel-node-config
          items:
          - key: prepare_node.sh
            path: prepare_node.sh
            mode: 493
      - name: home-disk
      {{- if .Values.node.homeDisk.useEphemeralPVC }}
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes:
                {{- toYaml .Values.node.homeDisk.accessModes | nindent 16 }}
              resources:
                requests:
                  storage: {{ .Values.node.homeDisk.size | quote }}
              {{- if .Values.node.homeDisk.storageClassName }}
              storageClassName: {{ .Values.node.homeDisk.storageClassName | quote }}
              {{- end }}
      {{- else }}
        hostPath:
          path: {{ .Values.node.hostDiskPath }}
          type: DirectoryOrCreate
      {{- end }}
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 500Mi
      - name: adx-config
        configMap:
          name: akernel-adx-config
      {{- if or .Values.monitoring.prometheusEndpoint .Values.monitoring.lokiEndpoint .Values.monitoring.tempoEndpoint }}
      - name: otel-collector-config
        configMap:
          name: akernel-otel-collector-config
      {{- end }}
