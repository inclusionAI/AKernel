{{- if .Values.node.secret.create }}
{{- $existing := dict }}
{{- if .Values.node.secret.preserveExisting }}
{{- $existing = lookup "v1" "Secret" .Release.Namespace "akernel-secrets" | default dict }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: akernel-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
{{- if $existing.data }}
data:
{{ $existing.data | toYaml | indent 2 }}
{{- else }}
stringData:
  oss_auths.json: |
{{ .Values.node.secret.oss_auths | toPrettyJson | indent 4 }}

  registry_auths.json: |
{{ .Values.node.secret.registry_auths | toPrettyJson | indent 4 }}
{{- end }}
{{- end }}
