                      "CAP_AUDIT_CONTROL",
                      "CAP_SETFCAP",
                      "CAP_MAC_OVERRIDE",
                      "CAP_MAC_ADMIN",
                      "CAP_SYSLOG",
                      "CAP_WAKE_ALARM",
                      "CAP_BLOCK_SUSPEND",
                      "CAP_AUDIT_READ",
                      "CAP_PERFMON",
                      "CAP_BPF"
                  ],
                  "effective": [
                      "CAP_CHOWN",
                      "CAP_DAC_OVERRIDE",
                      "CAP_DAC_READ_SEARCH",
                      "CAP_FOWNER",
                      "CAP_FSETID",
                      "CAP_KILL",
                      "CAP_SETGID",
                      "CAP_SETUID",
                      "CAP_SETPCAP",
                      "CAP_LINUX_IMMUTABLE",
                      "CAP_NET_BIND_SERVICE",
                      "CAP_NET_BROADCAST",
                      "CAP_NET_ADMIN",
