createNamespace: true

kruise:
  enabled: false

imagePullSecrets: []
imagePullSecret:
  create: false
  name: "acr-secret"
  dockerconfigjson: ""

serviceAccount:
  name: default

monitoring:
  akernelEnv: "default"
  prometheusEndpoint: ""
  lokiEndpoint: ""
  tempoEndpoint: ""

image:
  repository: registry.example.com/akernel/all-in-one
  tag: "latest"
  pullPolicy: IfNotPresent

auth:
  # Existing Secret that contains the JWT signing seed. For
  # `helm template | kubectl apply`, prefer pre-creating this Secret with
  # deploy/scripts/ensure-iam-secret.sh so repeated applies do not rotate it.
  existingSecret: ""
  # Optional explicit JWT signing seed. If empty and no existingSecret is set,
  # the chart generates a random hex seed at render time.
  litebusDataKey: ""

# Shared TLS material used by the openYuanrong frontend and IAM services.
# The chart generates a deployment-specific self-signed certificate when an
# existing Secret or explicit certificate is not supplied.
componentTLS:
  existingSecret: ""
  secretName: "akernel-component-tls"
  caCrt: ""
  moduleCrt: ""
  moduleKey: ""

etcd:
  # The bundled chart currently manages one durable etcd member. Use an
  # external HA etcd deployment when control-plane availability requires it.
  replicas: 1
  dataDir: /etcd
  persistence:
    enabled: true
    storageClassName: ""
    size: "20Gi"
    accessModes:
    - ReadWriteOnce
  volumePermissions:
    enabled: true
    runAsUser: 0
    dataUser: 1001
  image:
    repository: public.ecr.aws/bitnami/etcd
    tag: 3.6.8
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "1"
      memory: "2Gi"
    requests:
      cpu: "1"
      memory: "2Gi"
  args:
    quotaBackendBytes: "42949672960"
    autoCompactionRetention: "100000"

master:
  replicas: 1
  host: ""
  port: "22770"
  service:
    type: ClusterIP
    annotations: {}
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  resources:
    limits:
      cpu: "1"
      memory: "2Gi"
    requests:
      cpu: "1"
      memory: "2Gi"
  etcd:
    host: ""
    port: "2379"

frontend:
  enabled: true
  replicas: 2
  service:
    type: ClusterIP
    annotations: {}
  # Image defaults to the global all-in-one image. Set these only to override.
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  resources:
    limits:
      cpu: "1"
      memory: "2Gi"
    requests:
      cpu: "1"
      memory: "2Gi"
  etcd:
    host: ""
    port: "2379"
  master:
    metaServiceAddress: ""
    iamServerAddress: ""

node:
  secret:
    create: true
    oss_auths: {}
    registry_auths:
      auths: {}
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  resources:
    limits:
      ephemeral-storage: 1Gi
    requests:
