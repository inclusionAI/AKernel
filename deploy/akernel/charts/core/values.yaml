    oss:
      type: oss
      oss:
        scheme: "http"
        endpoint: ""
        access_key_id: ""
        access_key_secret: ""
        bucket: ""
        object_prefix: "/"
        retry_limit: 3
        connect_timeout: 300
        timeout: 300
        proxy:
          url: ""
          ping_url: ""
          fallback: true
          check_interval: 60
    registry:
      type: "registry"
      registry:
        scheme: "https"
        host: ""
        repo: ""
        auth: ""
        skip_verify: true
        timeout: 300
        retry_limit: 5
        connect_timeout: 300
        blob_url_scheme: "http"
        proxy:
          url: ""
          ping_url: ""
          fallback: true
          check_interval: 60

    resourceControl:
      memoryLimit: "16G"
      cpuQuota: "800%"

    sandboxd:
      config: |-
        rootDir="/home/akernel/sandboxd/root"
        storeDir="/home/akernel/sandboxd/store"

        [plugin]
        disable_tcp_service=false
        stream_idle_timeout=""
        stream_server_address=""
        stream_server_port=""

        [plugin.network]
        ip_range="172.17.0.1/16"
        nat_backend="iptables"
        enable_network_acl=true

        [plugin.resource]
        cgroup_cache_size=800
        pids_max=4096
        netns_cache_size=1000
        interface_cache_size=1000
        cgroup_root_name="/akernel"
        max_instance_num=1000
        enable_cache_in_stock_mode=true

        [plugin.runtime]
        image_lib_dir="/home/akernel/images"
        resolv_conf_path="/etc/resolv_akernel.conf"
        # filestore_dir must reside on an XFS filesystem with reflink support.
        # sandboxd will automatically create an XFS image at /home/akernel/xfs.img
        # and mount it here if the mount point does not already exist as XFS.
        # filestore_dir_size controls the size of that XFS image.
        filestore_dir="/home/akernel/xfs"
        filestore_dir_size="200G"
        overlay_tmpfs_size="10G"

        [plugin.runtime.basic_spec]
        runsc="/home/akernel/images/config.json"

        [plugin.runtime.runtime_binary]
        runsc="/usr/local/bin/runsc"
        kata="/usr/local/bin/containerd-shim-kata-v2"

        [plugin.runtime.kata]
        config_path="/opt/kata/share/defaults/kata-containers/runtime-rs/configuration-dragonball.toml"
        kvm_device="/dev/kvm"
        dan_config_dir="/run/kata-containers/dans"
        logger_binary="/usr/local/bin/sandbox-logger"

        # image-manager config. root holds image-manager runtime state
        # (daemons/, mount_records.db) and is wiped on pod change; input
        # configs live under /home/akernel/sandboxd/config/ so the wipe never
        # hits the read-only bind-mounted config files.
        [plugin.image]
        root="/home/akernel/sandboxd/image_manager"
        distill_fs_bin="/usr/local/bin/distill_fs"
        oss_template="/home/akernel/sandboxd/config/oss.json"
        nydus_template="/home/akernel/sandboxd/config/registry.json"
        nydus_suffix="_nydus_v3"
        oss_auths_path="/home/akernel/sandboxd/config/oss_auths.json"
        registry_auths_path="/home/akernel/sandboxd/config/registry_auths.json"
        cgroup_memory_limit="64GiB"

        # node-resource config. sock_path matches what yuanrong's C++
        # external_system_collector reads, so it must stay /var/run/...
        [plugin.node_resource]
        provider="kubernetes"
        sock_path="/var/run/resource.sock"

traefik:
  enabled: false
  mode: "http"
  enableTLS: false
  # When enabled, creates a separate "web" entrypoint (no TLS) on its own port
  # for port forwarding traffic, while frontend API stays on "websecure" with TLS.
  enableWebEntrypoint: true
  # Transport options for the frontend (akernel-master) backend.
  frontendTransport:
    # Force HTTP/1.1 to the frontend backend. The HTTP provider reloads the
    # full config every 1s, and the per-sandbox routes churn constantly; each
    # reload drains Traefik's backend connections. An HTTP/2 backend uses a
    # single multiplexed connection, so a reload stalls all in-flight requests
    # for 7-10s. An HTTP/1.1 connection pool avoids this. Keep true unless the
    # frontend backend requires HTTP/2 (e.g. gRPC over :8888).
    disableHTTP2: true
  replicas: 1
  image:
    repository: traefik
    tag: v3.6.8
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    clusterIP: ""
    annotations: {}
    loadBalancerIP: ""
  ports:
    tcp: 8888
    websecure: 443
    web: 80
    dashboard: 9990
  tls:
    enabled: false
    createSecret: false
    secretName: "traefik-tls"
    moduleCrt: ""
    moduleKey: ""
  internalStats:
    enabled: false
    image: busybox:1.37.0-musl
    port: 8079
  grafana:
    enabled: false
    url: "http://grafana.akernel-monitor.svc:3000"
