createNamespace: true

kruise:
  enabled: false

imagePullSecrets: []
imagePullSecret:
  create: false
  name: "acr-secret"
  dockerconfigjson: ""

serviceAccount:
  name: default

monitoring:
  # Stable identity shared by Coordinator, API Server and node metrics.
  clusterName: "akernel"
  akernelEnv: "default"
  prometheusEndpoint: ""
  lokiEndpoint: ""
  tempoEndpoint: ""

image:
  digest: ""
  repository: registry.example.com/akernel/all-in-one
  tag: "latest"
  pullPolicy: IfNotPresent

# Agent DX is the default AKernel control and data plane. The chart expects an
# existing Secret containing the public HTTPS certificate and initial API key;
# see deploy/README.md for the exact key contract.
adx:
  namespace: akernel
  schedulerShards: 1
  # Execd pushes checkpoint requests and runtime status directly to adxlet.
  runtimeControl:
    enabled: true
    port: 19003
  # The operator mounts JuiceFS or AFS on every eligible node and Coordinator
  # host, or provides an existing RWX CSI claim. Credentials stay in that layer.
  checkpointStorage:
    kind: local
    alias: akernel-checkpoints
    mountPath: /mnt/akernel-shared
    hostPath: ""
    existingClaim: ""
    prefix: akernel/checkpoints
    # Requires an ADX release supporting distributed_fs.local_cache.
    localCache:
      enabled: false
      root: /home/akernel/adx/checkpoints
      budgetBytes: 53687091200
      maxEntries: 500
    # Optional placement shared by execution nodes and Coordinator. Managed
    # JuiceFS sets this to its client selector so both roles have a host mount.
    nodeSelector: {}
  tls:
    existingSecret: akernel-adx-tls
  redis:
    mode: managed
    appendfsync: everysec
    external:
      existingSecret: ""
      urlKey: redis-url
    persistence:
      enabled: true
      storageClassName: ""
      size: 20Gi
      accessModes:
        - ReadWriteOnce
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  coordinator:
    replicas: 1
    nodeSelector: {}
    tolerations: []
    affinity: {}
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  ingressApi:
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    replicas: 1
    portHostDomain: ""
    publicService:
      enabled: false
      type: LoadBalancer
      controlPort: 443
      dataPort: 80
      annotations: {}
      loadBalancerIP: ""
      externalTrafficPolicy: Cluster
    resources:
      requests:
        cpu: "2"
        memory: 256Mi
      limits:
        cpu: "8"
        memory: 1Gi
  node:
    allowedTargetCidrs: 10.88.0.0/16
    allowedIngressCidrs: 0.0.0.0/0
    reportIntervalSeconds: 5
    metricsIntervalSeconds: 15
    resourceValidForSeconds: 30

# Preserve the existing placement setting; translate binpack to ADX pack.
coordinator:
  image:
    digest: ""
    repository: ""
    tag: ""
    pullPolicy: ""
  schedulePlacementPolicy: spread

node:
  secret:
    create: true
    oss_auths: {}
    registry_auths:
      auths: {}
  image:
    digest: ""
    repository: ""
    tag: ""
    pullPolicy: ""
  resources:
    limits:
      ephemeral-storage: 50Gi
    requests:
      ephemeral-storage: 50Gi
  annotations: {}
  # Operator-managed preparation; see deploy/docs/node-local-directories.md
  # and deploy/akernel/examples/node-local-directories.yaml. Lists replace on merge.
  initContainers: []
  directoryHelper:
    # Package the script for the init-container example without invoking it.
    # Disabled by default to preserve the node rollout checksum.
    enabled: false
  hostDiskPath: "/home/akernel"
  homeDisk:
    useEphemeralPVC: false
    storageClassName: ""
    size: "400Gi"
    accessModes:
    - ReadWriteOnce
  config:
