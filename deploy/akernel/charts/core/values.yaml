              ]
          },
          "root": {
              "path": "rootfs",
              "readonly": false
          },
          "hostname": "akernel",
          "mounts": [
              {
                  "destination": "/proc",
                  "type": "proc",
                  "source": "proc"
              },
              {
                  "destination": "/dev",
                  "type": "tmpfs",
                  "source": "tmpfs"
              },
              {
                  "destination": "/sys",
                  "type": "sysfs",
                  "source": "sysfs",
                  "options": [
                      "nosuid",
                      "noexec",
                      "nodev",
                      "ro"
                  ]
              },
              {
                  "destination": "/sys/fs/cgroup",
                  "type": "cgroup",
                  "source": "cgroup",
                  "options": [
                      "ro",
                      "nosuid",
                      "noexec",
                      "nodev"
                  ]
              },
              {
                "destination": "/etc/resolv.conf",
                "type": "bind",
                "source": "/etc/resolv_akernel.conf",
