createNamespace: true

kruise:
  enabled: false

imagePullSecrets: []
imagePullSecret:
  create: false
  name: "acr-secret"
  dockerconfigjson: ""

serviceAccount:
  name: default

monitoring:
  akernelEnv: "default"
  prometheusEndpoint: ""
  lokiEndpoint: ""
  tempoEndpoint: ""

image:
  repository: registry.example.com/akernel/all-in-one
  tag: "latest"
  pullPolicy: IfNotPresent

# Agent DX is the default AKernel control and data plane. The chart expects an
# existing Secret containing the public HTTPS certificate and initial API key;
# see deploy/README.md for the exact key contract.
adx:
  namespace: akernel
  schedulerShards: 1
  tls:
    existingSecret: akernel-adx-tls
  redis:
    mode: managed
    appendfsync: everysec
    external:
      existingSecret: ""
      urlKey: redis-url
    persistence:
      enabled: true
      storageClassName: ""
      size: 20Gi
      accessModes:
        - ReadWriteOnce
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  coordinator:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  ingressApi:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  node:
    allowedTargetCidrs: 10.88.0.0/16
    allowedIngressCidrs: 0.0.0.0/0
    reportIntervalSeconds: 5
    resourceValidForSeconds: 30

# Preserve the existing placement setting; translate binpack to ADX pack.
coordinator:
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  schedulePlacementPolicy: spread

node:
  secret:
    create: true
    oss_auths: {}
    registry_auths:
      auths: {}
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  resources:
    limits:
      ephemeral-storage: 1Gi
    requests:
      ephemeral-storage: 1Gi
  annotations: {}
  initContainers: []
  hostDiskPath: "/home/akernel"
  homeDisk:
    useEphemeralPVC: false
    storageClassName: ""
    size: "400Gi"
    accessModes:
    - ReadWriteOnce
  config:
    ociConfig: |-
      {
          "ociVersion": "1.0.0",
          "process": {
              "terminal": false,
              "user": {
                  "uid": 0,
                  "gid": 0
              },
              "env": [
                  "PATH=/var/lang/bin:/usr/local/bin:/usr/bin/:/bin:/opt/bin",
                  "LD_LIBRARY_PATH=/var/lang/lib:/lib64:/usr/lib64:/var/runtime:/var/runtime/lib:/var/task:/var/task/lib:/opt/lib",
                  "LANG=en_US.UTF-8",
                  "TERM=xterm"
              ],
              "cwd": "/",
              "args": [
                  "bash",
                  "entrypoint.sh"
              ],
              "capabilities": {
                  "bounding": [
                      "CAP_CHOWN",
                      "CAP_DAC_OVERRIDE",
                      "CAP_DAC_READ_SEARCH",
                      "CAP_FOWNER",
                      "CAP_FSETID",
                      "CAP_KILL",
                      "CAP_SETGID",
                      "CAP_SETUID",
                      "CAP_SETPCAP",
                      "CAP_LINUX_IMMUTABLE",
                      "CAP_NET_BIND_SERVICE",
                      "CAP_NET_BROADCAST",
                      "CAP_NET_ADMIN",
                      "CAP_NET_RAW",
                      "CAP_IPC_LOCK",
                      "CAP_IPC_OWNER",
                      "CAP_SYS_MODULE",
                      "CAP_SYS_RAWIO",
                      "CAP_SYS_CHROOT",
                      "CAP_SYS_PTRACE",
                      "CAP_SYS_PACCT",
                      "CAP_SYS_ADMIN",
                      "CAP_SYS_BOOT",
                      "CAP_SYS_NICE",
                      "CAP_SYS_RESOURCE",
                      "CAP_SYS_TIME",
                      "CAP_SYS_TTY_CONFIG",
                      "CAP_MKNOD",
                      "CAP_LEASE",
                      "CAP_AUDIT_WRITE",
                      "CAP_AUDIT_CONTROL",
                      "CAP_SETFCAP",
                      "CAP_MAC_OVERRIDE",
                      "CAP_MAC_ADMIN",
                      "CAP_SYSLOG",
                      "CAP_WAKE_ALARM",
                      "CAP_BLOCK_SUSPEND",
                      "CAP_AUDIT_READ",
                      "CAP_PERFMON",
                      "CAP_BPF"
                  ],
                  "effective": [
                      "CAP_CHOWN",
                      "CAP_DAC_OVERRIDE",
                      "CAP_DAC_READ_SEARCH",
                      "CAP_FOWNER",
                      "CAP_FSETID",
                      "CAP_KILL",
                      "CAP_SETGID",
                      "CAP_SETUID",
                      "CAP_SETPCAP",
                      "CAP_LINUX_IMMUTABLE",
                      "CAP_NET_BIND_SERVICE",
                      "CAP_NET_BROADCAST",
                      "CAP_NET_ADMIN",
                      "CAP_NET_RAW",
                      "CAP_IPC_LOCK",
                      "CAP_IPC_OWNER",
                      "CAP_SYS_MODULE",
                      "CAP_SYS_RAWIO",
                      "CAP_SYS_CHROOT",
                      "CAP_SYS_PTRACE",
                      "CAP_SYS_PACCT",
                      "CAP_SYS_ADMIN",
                      "CAP_SYS_BOOT",
                      "CAP_SYS_NICE",
                      "CAP_SYS_RESOURCE",
                      "CAP_SYS_TIME",
                      "CAP_SYS_TTY_CONFIG",
                      "CAP_MKNOD",
                      "CAP_LEASE",
                      "CAP_AUDIT_WRITE",
                      "CAP_AUDIT_CONTROL",
                      "CAP_SETFCAP",
                      "CAP_MAC_OVERRIDE",
                      "CAP_MAC_ADMIN",
                      "CAP_SYSLOG",
                      "CAP_WAKE_ALARM",
                      "CAP_BLOCK_SUSPEND",
                      "CAP_AUDIT_READ",
                      "CAP_PERFMON",
                      "CAP_BPF"
                  ],
                  "inheritable": [
                      "CAP_CHOWN",
                      "CAP_DAC_OVERRIDE",
                      "CAP_DAC_READ_SEARCH",
                      "CAP_FOWNER",
                      "CAP_FSETID",
                      "CAP_KILL",
                      "CAP_SETGID",
                      "CAP_SETUID",
                      "CAP_SETPCAP",
                      "CAP_LINUX_IMMUTABLE",
                      "CAP_NET_BIND_SERVICE",
                      "CAP_NET_BROADCAST",
                      "CAP_NET_ADMIN",
                      "CAP_NET_RAW",
                      "CAP_IPC_LOCK",
                      "CAP_IPC_OWNER",
                      "CAP_SYS_MODULE",
                      "CAP_SYS_RAWIO",
                      "CAP_SYS_CHROOT",
                      "CAP_SYS_PTRACE",
                      "CAP_SYS_PACCT",
                      "CAP_SYS_ADMIN",
                      "CAP_SYS_BOOT",
                      "CAP_SYS_NICE",
                      "CAP_SYS_RESOURCE",
                      "CAP_SYS_TIME",
                      "CAP_SYS_TTY_CONFIG",
                      "CAP_MKNOD",
                      "CAP_LEASE",
                      "CAP_AUDIT_WRITE",
                      "CAP_AUDIT_CONTROL",
                      "CAP_SETFCAP",
                      "CAP_MAC_OVERRIDE",
                      "CAP_MAC_ADMIN",
                      "CAP_SYSLOG",
                      "CAP_WAKE_ALARM",
                      "CAP_BLOCK_SUSPEND",
                      "CAP_AUDIT_READ",
                      "CAP_PERFMON",
                      "CAP_BPF"
                  ],
                  "permitted": [
                      "CAP_CHOWN",
                      "CAP_DAC_OVERRIDE",
                      "CAP_DAC_READ_SEARCH",
                      "CAP_FOWNER",
                      "CAP_FSETID",
                      "CAP_KILL",
                      "CAP_SETGID",
                      "CAP_SETUID",
                      "CAP_SETPCAP",
                      "CAP_LINUX_IMMUTABLE",
                      "CAP_NET_BIND_SERVICE",
                      "CAP_NET_BROADCAST",
                      "CAP_NET_ADMIN",
                      "CAP_NET_RAW",
                      "CAP_IPC_LOCK",
                      "CAP_IPC_OWNER",
                      "CAP_SYS_MODULE",
                      "CAP_SYS_RAWIO",
                      "CAP_SYS_CHROOT",
                      "CAP_SYS_PTRACE",
                      "CAP_SYS_PACCT",
                      "CAP_SYS_ADMIN",
                      "CAP_SYS_BOOT",
                      "CAP_SYS_NICE",
                      "CAP_SYS_RESOURCE",
                      "CAP_SYS_TIME",
                      "CAP_SYS_TTY_CONFIG",
                      "CAP_MKNOD",
                      "CAP_LEASE",
                      "CAP_AUDIT_WRITE",
                      "CAP_AUDIT_CONTROL",
                      "CAP_SETFCAP",
                      "CAP_MAC_OVERRIDE",
                      "CAP_MAC_ADMIN",
                      "CAP_SYSLOG",
                      "CAP_WAKE_ALARM",
                      "CAP_BLOCK_SUSPEND",
                      "CAP_AUDIT_READ",
                      "CAP_PERFMON",
                      "CAP_BPF"
                  ]
              },
              "rlimits": [
                  {
                      "type": "RLIMIT_NOFILE",
                      "hard": 65535,
                      "soft": 65535
                  }
              ]
          },
          "root": {
              "path": "rootfs",
              "readonly": false
          },
          "hostname": "akernel",
          "mounts": [
              {
                  "destination": "/proc",
                  "type": "proc",
                  "source": "proc"
              },
              {
                  "destination": "/dev",
                  "type": "tmpfs",
                  "source": "tmpfs"
              },
              {
                  "destination": "/sys",
                  "type": "sysfs",
                  "source": "sysfs",
                  "options": [
                      "nosuid",
                      "noexec",
                      "nodev",
                      "ro"
                  ]
              },
              {
                  "destination": "/sys/fs/cgroup",
                  "type": "cgroup",
                  "source": "cgroup",
                  "options": [
                      "ro",
                      "nosuid",
                      "noexec",
                      "nodev"
                  ]
              }
          ],
          "linux": {
              "namespaces": [
                  {
                      "type": "pid"
                  },
                  {
                      "type": "network"
                  },
                  {
                      "type": "ipc"
                  },
                  {
                      "type": "uts"
                  },
                  {
                      "type": "mount"
                  }
              ]
          }
      }

    oss:
      type: oss
      oss:
        scheme: "http"
        endpoint: ""
        access_key_id: ""
        access_key_secret: ""
        bucket: ""
        object_prefix: "/"
        retry_limit: 3
        connect_timeout: 300
        timeout: 300
        proxy:
          url: ""
          ping_url: ""
          fallback: true
          check_interval: 60
    registry:
      type: "registry"
      registry:
        scheme: "https"
        host: ""
        repo: ""
        auth: ""
        skip_verify: true
        timeout: 300
        retry_limit: 5
        connect_timeout: 300
        blob_url_scheme: "http"
        proxy:
          url: ""
          ping_url: ""
          fallback: true
          check_interval: 60

    resourceControl:
      memoryLimit: "16G"
      cpuQuota: "800%"

    sandboxd:
      # The node image must also be built with AKERNEL_ENABLE_RUNC=true.
      # Sandboxd probes runc and runc-shim before advertising the runtime.
      enableRunc: false
      # Empty uses the distill-fs default (100 GiB on Linux).
      chunkDbSize: ""
      config: |-
        rootDir="/home/akernel/sandboxd/root"
        storeDir="/home/akernel/sandboxd/store"

        [plugin]
        disable_tcp_service=false
        stream_idle_timeout=""
        stream_server_address=""
        stream_server_port=""

        [plugin.network]
        ip_range="10.88.0.1/16"
        nat_backend="iptables"
        enable_network_acl=true

        [plugin.resource]
        cgroup_cache_size=800
        pids_max=4096
        netns_cache_size=1000
        interface_cache_size=1000
        cgroup_root_name="/akernel"
        max_instance_num=1000
        enable_cache_in_stock_mode=true

        [plugin.runtime]
        image_lib_dir="/home/akernel/images"
        resolv_conf_path="/etc/resolv_akernel.conf"
        # A configured size creates a loop-backed bounded filestore. ext4 is
        # used by default; set filestore_xfs_enabled=true to select XFS.
        filestore_dir="/home/akernel/filestore"
        filestore_dir_size="200G"
        filestore_xfs_enabled=false
        loop_device_dir="/dev"
        overlay_tmpfs_size="10G"

        [plugin.runtime.basic_spec]
        runsc="/home/akernel/images/config.json"
        runc=""
        firecracker="/home/akernel/images/config.json"

        [plugin.runtime.runtime_binary]
        runsc="/usr/local/bin/runsc"
        kata="/usr/local/bin/containerd-shim-kata-v2"
        firecracker="/usr/local/bin/firecracker"
        # AKERNEL_RUNTIME_RUNC

        [plugin.runtime.firecracker]
        virtiofs_enabled=true
        virtiofsd_path="/usr/local/bin/virtiofsd"
        writable_io_engine="AsyncDirect"
        writable_cache_type="Writeback"

        [plugin.runtime.kata]
        config_path="/opt/kata/share/defaults/kata-containers/runtime-rs/configuration-dragonball.toml"
        kvm_device="/dev/kvm"
        dan_config_dir="/run/kata-containers/dans"
        logger_binary="/usr/local/bin/sandbox-logger"

        [plugin.runtime.runc]
        state_root="/run/sandboxd/runc"
        shim_binary="/usr/local/bin/runc-shim"
        kvm_device="/dev/kvm"

        # image-manager config. root holds image-manager runtime state
        # (daemons/, mount_records.db) and is wiped on pod change; input
        # configs live under /home/akernel/sandboxd/config/ so the wipe never
        # hits the read-only bind-mounted config files.
        [plugin.image]
        # AKERNEL_CHUNK_DB_SIZE
        root="/home/akernel/sandboxd/image_manager"
        distill_fs_bin="/usr/local/bin/distill_fs"
        oss_template="/home/akernel/sandboxd/config/oss.json"
        nydus_template="/home/akernel/sandboxd/config/registry.json"
        nydus_suffix="_nydus_v3"
        oss_auths_path="/home/akernel/sandboxd/config/oss_auths.json"
        registry_auths_path="/home/akernel/sandboxd/config/registry_auths.json"
        cgroup_memory_limit="64GiB"

        # node-resource config. sock_path matches the sandboxd
        # external_system_collector reads, so it must stay /var/run/...
        [plugin.node_resource]
        provider="kubernetes"
        sock_path="/var/run/resource.sock"

traefik:
  enabled: false
  mode: "http"
  enableTLS: false
  # Legacy control-plane deployments may disable the separate web entrypoint.
  # ADX always exposes websecure for control traffic and web for instance data,
  # regardless of this compatibility setting.
  enableWebEntrypoint: true
  replicas: 1
  image:
    repository: traefik
    tag: v3.6.8
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    clusterIP: ""
    annotations: {}
    loadBalancerIP: ""
  ports:
    tcp: 8888
    websecure: 443
    web: 80
    dashboard: 9990
  tls:
    enabled: false
    createSecret: false
    secretName: "traefik-tls"
    moduleCrt: ""
    moduleKey: ""
  internalStats:
    enabled: false
    image: busybox:1.37.0-musl
    port: 8079
  grafana:
    enabled: false
    url: "http://grafana.akernel-monitor.svc:3000"
