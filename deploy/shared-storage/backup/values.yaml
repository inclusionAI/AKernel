enabled: false
image: ""
imagePullSecrets: []
schedule: "0 18 * * *"
timeZone: Etc/UTC
hostMountPath: /srv/akernel-shared
nodeSelector:
  node-role: akernel-control-plane
  akernel.io/checkpoint-client: "true"
tolerations:
  - {key: dedicated, operator: Equal, value: akernel-control-plane, effect: NoSchedule}
redis:
  host: akernel-redis-write
  port: 6379
  authSecret: akernel-redis-auth
postgres:
  host: juicefs-metadata-rw
  database: juicefs
  user: juicefs
  authSecret: juicefs-metadata-app
  caSecret: juicefs-metadata-ca
oidc:
  roleArn: ""
  providerArn: ""
# STS mode is for explicitly supplied short-lived credentials during validation.
stsSecret: ""
config:
  mountRoot: /shared
  checkpointPrefix: akernel/checkpoints-v1
  clonePrefix: .backup-staging
  redisNamespace: akernel
  storageAlias: akernel-checkpoints
  pauseMilliseconds: 45000
  workRoot: /work
  recoveryObjects: {}
  provenance: {}
  oss:
    credentialsMode: oidc
    endpoint: ""
    region: ""
    bucket: ""
    prefix: akernel
