{{- if .Values.enabled }}
{{- if not (regexMatch "@sha256:[0-9a-f]{64}$" .Values.image) }}{{ fail "backup tools image must be pinned by digest" }}{{ end }}
{{- if ne .Values.config.mountRoot "/shared" }}{{ fail "backup mountRoot must match /shared" }}{{ end }}
{{- if ne .Values.config.workRoot "/work" }}{{ fail "backup workRoot must match /work" }}{{ end }}
{{- if or (gt (int .Values.config.pauseMilliseconds) 45000) (lt (int .Values.config.pauseMilliseconds) 3000) }}{{ fail "backup pause must be between 3000 and 45000 milliseconds" }}{{ end }}
{{- if eq .Values.config.oss.credentialsMode "oidc" }}
{{- if or (empty .Values.oidc.roleArn) (empty .Values.oidc.providerArn) }}{{ fail "backup OIDC role and provider ARNs are required" }}{{ end }}
{{- else if eq .Values.config.oss.credentialsMode "sts" }}
{{- if empty .Values.stsSecret }}{{ fail "backup STS validation requires an explicit temporary credential Secret" }}{{ end }}
{{- else }}{{ fail "backup requires OIDC or temporary STS credentials" }}{{ end }}
{{- if or (empty .Values.config.oss.bucket) (empty .Values.config.oss.region) (not (hasPrefix "https://" .Values.config.oss.endpoint)) }}{{ fail "backup requires an OSS bucket, region and HTTPS endpoint" }}{{ end }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ .Release.Name }}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: {{ .Release.Name }}}
data:
  config.json: {{ toJson .Values.config | quote }}
  backup.py: |
    {{- .Files.Get "backup.py" | nindent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: {{ .Release.Name }}}
spec:
  schedule: {{ .Values.schedule | quote }}
  timeZone: {{ .Values.timeZone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels: {app: {{ .Release.Name }}}
          annotations:
            checksum/backup-config: {{ toJson .Values.config | sha256sum }}
            checksum/backup-script: {{ .Files.Get "backup.py" | sha256sum }}
        spec:
          serviceAccountName: {{ .Release.Name }}
          restartPolicy: Never
          nodeSelector: {{ toYaml .Values.nodeSelector | nindent 12 }}
          tolerations: {{ toYaml .Values.tolerations | nindent 12 }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets: {{ toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: backup
              image: {{ .Values.image | quote }}
              command: [python3, /scripts/backup.py, --config, /scripts/config.json]
              env:
                - {name: REDIS_HOST, value: {{ .Values.redis.host | quote }}}
                - {name: REDIS_PORT, value: {{ .Values.redis.port | quote }}}
                - name: REDISCLI_AUTH
                  valueFrom: {secretKeyRef: {name: {{ .Values.redis.authSecret }}, key: password}}
                - {name: PGHOST, value: {{ .Values.postgres.host | quote }}}
                - {name: PGDATABASE, value: {{ .Values.postgres.database | quote }}}
                - {name: PGUSER, value: {{ .Values.postgres.user | quote }}}
                - {name: PGSSLMODE, value: verify-full}
                - {name: PGSSLROOTCERT, value: /certs/ca.crt}
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: {{ .Values.postgres.authSecret }}, key: password}}
                {{- if eq .Values.config.oss.credentialsMode "oidc" }}
                - {name: ALIBABA_CLOUD_ROLE_ARN, value: {{ .Values.oidc.roleArn | quote }}}
                - {name: ALIBABA_CLOUD_OIDC_PROVIDER_ARN, value: {{ .Values.oidc.providerArn | quote }}}
                - {name: ALIBABA_CLOUD_OIDC_TOKEN_FILE, value: /oidc/token}
                {{- else }}
                {{- range $key := list "ALIBABA_CLOUD_ACCESS_KEY_ID" "ALIBABA_CLOUD_ACCESS_KEY_SECRET" "ALIBABA_CLOUD_SECURITY_TOKEN" }}
                - name: {{ $key }}
                  valueFrom: {secretKeyRef: {name: {{ $.Values.stsSecret }}, key: {{ $key }}}}
                {{- end }}
                {{- end }}
              resources:
                requests: {cpu: 500m, memory: 512Mi, ephemeral-storage: 8Gi}
                limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 10Gi}
              securityContext:
                runAsUser: 0
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: shared, mountPath: /shared, mountPropagation: HostToContainer}
                - {name: work, mountPath: /work}
                - {name: temporary, mountPath: /tmp}
                - {name: postgres-ca, mountPath: /certs, readOnly: true}
                {{- if eq .Values.config.oss.credentialsMode "oidc" }}
                - {name: oidc, mountPath: /oidc, readOnly: true}
                {{- end }}
          volumes:
            - name: scripts
              configMap: {name: {{ .Release.Name }}}
            - name: shared
              hostPath: {path: {{ .Values.hostMountPath | quote }}, type: Directory}
            - name: work
              emptyDir: {sizeLimit: 8Gi}
            - name: temporary
              emptyDir: {sizeLimit: 64Mi}
            - name: postgres-ca
              secret: {secretName: {{ .Values.postgres.caSecret }}, items: [{key: ca.crt, path: ca.crt}]}
            {{- if eq .Values.config.oss.credentialsMode "oidc" }}
            - name: oidc
              projected:
                sources:
                  - serviceAccountToken: {audience: sts.aliyuncs.com, expirationSeconds: 3600, path: token}
            {{- end }}
{{- range $namespace, $kinds := .Values.config.recoveryObjects }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: {{ $.Release.Name }}-recovery, namespace: {{ $namespace }}}
rules:
  {{- range $kind, $names := $kinds }}
  - apiGroups: [""]
    resources: [{{ $kind | quote }}]
    resourceNames: {{ toYaml $names | nindent 6 }}
    verbs: [get]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: {{ $.Release.Name }}-recovery, namespace: {{ $namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $.Release.Name }}-recovery}
subjects: [{kind: ServiceAccount, name: {{ $.Release.Name }}, namespace: {{ $.Release.Namespace }}}]
{{- end }}
{{- end }}
