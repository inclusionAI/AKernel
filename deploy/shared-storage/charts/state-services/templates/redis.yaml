{{- if not .Values.storageClass }}{{ fail "storageClass must be an independent cloud-disk StorageClass" }}{{ end -}}
{{- range $image := list .Values.redis.image .Values.redis.sentinelImage .Values.redis.exporterImage .Values.haproxy.image }}
{{- if not (regexMatch "@sha256:[0-9a-f]{64}$" $image) }}{{ fail "Redis, Sentinel and HAProxy images must be pinned by digest" }}{{ end -}}
{{- end }}
{{- $name := .Values.redis.name -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
data:
  redis-additional.conf: |
    appendonly yes
    appendfsync always
    no-appendfsync-on-rewrite no
    aof-load-truncated no
    maxmemory {{ .Values.redis.maxMemory }}
    maxmemory-policy noeviction
    min-replicas-to-write 1
    min-replicas-max-lag 5
    repl-backlog-size 64mb
    stop-writes-on-bgsave-error yes
    save 900 1
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: {{ $name }}
  labels: {akernel.io/state-service: "true"}
  annotations: {helm.sh/resource-policy: keep}
spec:
  clusterSize: 3
  kubernetesConfig:
    image: {{ .Values.redis.image | quote }}
    imagePullPolicy: IfNotPresent
    {{- with .Values.imagePullSecrets }}
    imagePullSecrets: {{ toYaml . | nindent 6 }}
    {{- end }}
    redisSecret: {name: {{ .Values.redis.authSecret | quote }}, key: password}
    resources: {{ toYaml .Values.redis.resources | nindent 6 }}
    persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  redisConfig:
    additionalRedisConfig: {{ $name }}-config
  podSecurityContext: {runAsUser: 1000, fsGroup: 1000}
  nodeSelector: {{ toYaml .Values.redis.nodeSelector | nindent 4 }}
  tolerations: {{ toYaml .Values.redis.tolerations | nindent 4 }}
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector: {matchLabels: {app: {{ $name }}}}
          topologyKey: topology.kubernetes.io/zone
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: {{ .Values.storageClass | quote }}
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.redis.size | quote }}}}
  redisExporter:
    enabled: true
    image: {{ .Values.redis.exporterImage | quote }}
    imagePullPolicy: IfNotPresent
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 256Mi}
  pdb: {enabled: true, minAvailable: 2}
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: {{ $name }}-sentinel
  labels: {akernel.io/state-service: "true"}
spec:
  clusterSize: 3
  kubernetesConfig:
    image: {{ .Values.redis.sentinelImage | quote }}
    imagePullPolicy: IfNotPresent
    {{- with .Values.imagePullSecrets }}
    imagePullSecrets: {{ toYaml . | nindent 6 }}
    {{- end }}
    redisSecret: {name: {{ .Values.redis.authSecret | quote }}, key: password}
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 256Mi}
  podSecurityContext: {runAsUser: 1000, fsGroup: 1000}
  redisSentinelConfig:
    redisReplicationName: {{ $name }}
    redisReplicationPassword:
      secretKeyRef: {name: {{ .Values.redis.authSecret | quote }}, key: password}
    masterGroupName: akernel
    redisPort: "6379"
    quorum: "2"
    parallelSyncs: "1"
    failoverTimeout: "60000"
    downAfterMilliseconds: "10000"
    resolveHostnames: "yes"
    announceHostnames: "yes"
  nodeSelector: {{ toYaml .Values.redis.nodeSelector | nindent 4 }}
  tolerations: {{ toYaml .Values.redis.tolerations | nindent 4 }}
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector: {matchLabels: {app: {{ $name }}-sentinel-sentinel}}
          topologyKey: topology.kubernetes.io/zone
  redisExporter:
    enabled: true
    image: {{ .Values.redis.exporterImage | quote }}
    imagePullPolicy: IfNotPresent
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 256Mi}
  pdb: {enabled: true, minAvailable: 2}
