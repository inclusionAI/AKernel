imagePullSecrets: []
readiness:
  image: docker.io/library/python:3.12-slim-bookworm@sha256:6a0e06f5ba0b373d051aabd3fffb9b873f27f9a2a3a14bcbe37dee6f0e3bbc70
  timeoutSeconds: 900
juicefs:
  # Disable filesystem clients/format/readiness for a Ceph RGW-only deployment.
  enabled: true
  image: docker.io/juicedata/mount:ce-v1.4.1@sha256:ab99388a397fe52575fdeb84a9e017c3c594a6b07d63966cd4805bbf6f172673
  volumeName: akernel-checkpoints
  hostMountPath: /srv/akernel-shared
  blockSizeKiB: 1024
  trashDays: 0
  cacheMiB: 4096
  # Empty selects /var/cache/<namespace>/<release>/juicefs on each host.
  cacheHostPath: ""
  cacheLargeWrite: true
  writeback: false
  readaheadMiB: 4
  nodeSelector: {kubernetes.io/os: linux}
ceph:
  image: quay.io/ceph/ceph@sha256:6bb1c8a42fbc0bf87938946990b65174466997bc11c31eb5a323225a779fd8f9
  storageClass: ""
  # Empty selects /var/lib/<storage-namespace>/rook on each storage host.
  dataDirHostPath: ""
  osdCount: 3
  osdSize: 100Gi
  monCount: 3
  monSize: 10Gi
  mgrCount: 1
  replicas: 3
  failureDomain: host
  # One device set per zone; empty retains the original host-based layout.
  zones: []
  gatewayInstances: 2
  gatewayTcpNoDelay: true
  # Set [aes256k] only after verifying all CephX keys use that type.
  # Empty preserves the operator's compatibility defaults for existing clients.
  allowedCiphers: []
  nodeSelector: {kubernetes.io/arch: amd64}
  tolerations: []
  resources:
    mon:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {memory: 2Gi}
    mgr:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {memory: 1Gi}
    osd:
      requests: {cpu: 1, memory: 4Gi}
      limits: {memory: 6Gi}
postgres:
  mode: managed
  # External means a database managed separately from this chart, including
  # an in-cluster CloudNativePG Cluster. Credentials stay in existingSecret.
  external:
    host: ""
    port: 5432
    database: juicefs
    user: juicefs
    sslMode: verify-full
    caSecret: ""
  image: docker.io/library/postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
  storageClass: ""
  size: 10Gi
  # An existing Secret must contain a password key. Generated credentials and
  # the metadata PVC are retained on uninstall and reused during upgrades.
  existingSecret: ""
