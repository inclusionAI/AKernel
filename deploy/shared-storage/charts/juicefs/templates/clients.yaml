{{- $name := include "juicefs.name" . -}}
{{- $cache := default (printf "/var/cache/%s/%s/juicefs" .Release.Namespace $name) .Values.juicefs.cacheHostPath -}}
{{- $cephRoot := default (printf "/var/lib/%s/rook" .Release.Namespace) .Values.ceph.dataDirHostPath -}}
{{- range $path := list .Values.juicefs.hostMountPath "/home/akernel" "/etc" "/run" "/var/run" "/proc" "/sys" "/dev" $cephRoot }}
{{- if or (eq $cache $path) (hasPrefix (printf "%s/" $path) $cache) (hasPrefix (printf "%s/" $cache) $path) }}
{{- fail "JuiceFS cache must not overlap shared, runtime, system, or Ceph state directories" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}-client
spec:
  selector:
    matchLabels: {app: {{ $name }}-client}
  # Drain consumers before explicitly replacing a FUSE mount client.
  updateStrategy: {type: OnDelete}
  template:
    metadata:
      labels: {app: {{ $name }}-client}
    spec:
      terminationGracePeriodSeconds: 90
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.juicefs.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      tolerations: [{operator: Exists}]
      initContainers:
        {{- if gt (int .Values.juicefs.cacheMiB) 0 }}
        - name: check-local-cache
          image: {{ .Values.juicefs.image | quote }}
          command: [/bin/sh, -ec]
          args:
            - |
              case "$(stat -f -c %T /cache)" in
                xfs|ext2/ext3|btrfs) ;;
                *) echo "JuiceFS cache requires a node-local disk filesystem" >&2; exit 1 ;;
              esac
              chmod 0700 /cache
          volumeMounts:
            - {name: cache, mountPath: /cache}
        {{- end }}
        - name: wait-for-format
          image: {{ .Values.juicefs.image | quote }}
          env:
            {{- include "juicefs.env" . | nindent 12 }}
          {{- if include "juicefs.pgMounts" . }}
          volumeMounts: {{ include "juicefs.pgMounts" . | nindent 12 }}
          {{- end }}
          command: [/bin/sh, -ec]
          args:
            - |
              attempt=0
              until juicefs --quiet --no-color status "$META_URL" >/dev/null 2>&1; do
                attempt=$((attempt + 1))
                [ "$attempt" -lt 360 ] || exit 1
                sleep 5
              done
      containers:
        - name: juicefs
          image: {{ .Values.juicefs.image | quote }}
          securityContext: {privileged: true}
          env:
            {{- include "juicefs.env" . | nindent 12 }}
          command: [juicefs]
          args:
            - --no-agent
            - --no-color
            - mount
            - $(META_URL)
            - /shared
            - -o
            - allow_other
            - --cache-size
            - {{ .Values.juicefs.cacheMiB | quote }}
            - --cache-dir
            - {{ ternary "/cache" "memory" (gt (int .Values.juicefs.cacheMiB) 0) | quote }}
            - {{ printf "--cache-large-write=%t" .Values.juicefs.cacheLargeWrite | quote }}
            - --writeback=false
            - --max-readahead
            - {{ .Values.juicefs.readaheadMiB | quote }}
            - --no-usage-report
          lifecycle:
            preStop:
              exec: {command: [fusermount3, -u, /shared]}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  awk '$5=="/shared" && / - fuse.juicefs JuiceFS:/ {ready=1}
                  END {exit !ready}' /proc/self/mountinfo
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            {{- include "juicefs.pgMounts" . | nindent 12 }}
            {{- if gt (int .Values.juicefs.cacheMiB) 0 }}
            - {name: cache, mountPath: /cache}
            {{- end }}
            - {name: shared, mountPath: /shared, mountPropagation: Bidirectional}
            - {name: fuse, mountPath: /dev/fuse}
      volumes:
        {{- include "juicefs.pgVolumes" . | nindent 8 }}
        {{- if gt (int .Values.juicefs.cacheMiB) 0 }}
        - name: cache
          hostPath: {path: {{ $cache | quote }}, type: DirectoryOrCreate}
        {{- end }}
        - name: shared
          hostPath: {path: {{ .Values.juicefs.hostMountPath | quote }}, type: DirectoryOrCreate}
        - name: fuse
          hostPath: {path: /dev/fuse, type: CharDevice}
