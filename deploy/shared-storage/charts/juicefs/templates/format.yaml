{{- $name := include "juicefs.name" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-format-{{ toJson .Values | sha256sum | trunc 8 }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: format
          image: {{ .Values.juicefs.image | quote }}
          env:
            {{- include "juicefs.env" . | nindent 12 }}
            - name: VOLUME_NAME
              value: {{ .Values.juicefs.volumeName | quote }}
          envFrom:
            - configMapRef: {name: {{ $name }}-bucket}
          {{- if include "juicefs.pgMounts" . }}
          volumeMounts: {{ include "juicefs.pgMounts" . | nindent 12 }}
          {{- end }}
          command: [/bin/sh, -ec]
          args:
            - |
              attempt=0
              until juicefs --quiet --no-color format --no-update --storage s3 \
                --bucket "http://${BUCKET_HOST}:${BUCKET_PORT}/${BUCKET_NAME}" \
                --block-size {{ .Values.juicefs.blockSizeKiB }} --trash-days {{ .Values.juicefs.trashDays }} \
                "$META_URL" "$VOLUME_NAME"; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 120 ]; then
                  echo 'JuiceFS format did not become ready' >&2
                  exit 1
                fi
                sleep 5
              done
      {{- if include "juicefs.pgVolumes" . }}
      volumes: {{ include "juicefs.pgVolumes" . | nindent 8 }}
      {{- end }}
